pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'bettacraft'

// M52: multiloader layout. common: the loader-independent mod (compiled against vanilla Minecraft only, the JUnit tests,
// the resources and the generated data); neoforge: the NeoForge mod (platform layer, events, capabilities, datagen, the
// dev source set with the smoke scenes and GameTests). Each loader module compiles the common sources into its own jar.
include 'common', 'neoforge'
