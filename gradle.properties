org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# M52b: no Parchment mappings for 1.21.11 (Mojang names only)

minecraft_version=1.21.11
minecraft_version_range=[1.21.11]
# Version we build against (M52b: the newest NeoForge for 1.21.11). The declared runtime range is neo_version_range.
neo_version=21.11.48
neo_version_range=[21.11.40,)
loader_version_range=[4,)

mod_id=bettacraft
mod_name=Bettacraft
mod_license=MIT
mod_version=1.56.0-beta.1
mod_group_id=org.overengineer.bettacraft
mod_authors=0verEngineer
mod_description=Betta fish with Mendel genetics and realistic breeding: catch wild bettas in swamps, keep them in multiblock aquariums of any glass with heaters, coolers, filters, feeder and light, care for the water quality, breed live food, and build the inside of the aquarium block by block. Optional support for GuideME, JEI, Jade, The One Probe, WTHIT and other aquarium mods.

junit_version=5.11.3
# optional integrations (compileOnly)
jade_version=21.1.7+neoforge
guideme_version=21.11.1-beta
jei_version=27.54.0.116
# The One Probe and WTHIT (M8): not part of ATM10, latest releases for 1.21.11 NeoForge (M52b)
top_version=1.21.11_neo-13.0.0
wthit_version=neo-18.2.3
# M52: the Fabric builds of the overlay / recipe viewer mods (Modrinth version numbers; M52b: 1.21.11, no TOP and no EMI there)
jade_fabric_version=21.1.6+fabric
jei_fabric_version=27.54.0.116
wthit_fabric_version=fabric-18.2.3
rei_fabric_version=21.11.816+fabric
architectury_fabric_version=19.0.1+fabric
badpackets_version=neo-0.11.2
badpackets_fabric_version=fabric-0.11.2
# Create (M32 part c): no build for 1.21.11 (M52b), its integration rests on this branch
# aquarium mods for the dev runtime (M7; not compiled against). M52b: on 1.21.11 only Fish of Thieves and Aquaculture 2 exist
# (Better Fish Tanks, Fintastic and Naturalist have no 1.21.11 build)
fish_of_thieves_version=21.11.2.0-neoforge
fish_of_thieves_fabric_version=21.11.2.0-fabric
yacl_version=3.8.2+1.21.11-neoforge
aquaculture_version=2.8.10

# ---- M52: multiloader
# vanilla Minecraft for the common module (ModDevGradle in NeoForm mode)
neo_form_version=1.21.11-20251209.172050
# Forge Config API Port: NeoForge's ModConfigSpec for the common code (on Fabric also at runtime)
forgeconfigapiport_version=21.11.1

# ---- M52: Fabric (fabric/), M52b: 1.21.11. Mod versions from the official mavens / Modrinth version ids.
fabric_loader_version=0.19.5
fabric_api_version=0.141.6+1.21.11
# Team Reborn Energy (the energy API of Fabric; bundled in the Fabric jar)
teamreborn_energy_version=4.1.0
modmenu_version=17.0.1
# M52b: Modonomicon for Fabric 1.21.11 (the handbook on Fabric; Patchouli has no 1.21.11 build)
# (the Modrinth version id: NeoForge and Fabric builds share the version number 1.21.11-1.121.0, the number alone resolves to the NeoForge jar)
modonomicon_fabric_version=okw2zHOG

# ---- M59: ports of the dev servers (never the default 25565, a real server may hold it; each branch its own)
dev_server_port=25581
dev_fabric_server_port=25582
