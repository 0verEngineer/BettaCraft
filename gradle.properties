org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# M52c: Minecraft 26.1 is not obfuscated any more (no mappings at all), Java 25. M52d: Minecraft 26.2 (no patch versions)

minecraft_version=26.2
minecraft_version_range=[26.2]
# M69: the branch facts of the workflows (.github is the same on every branch; tools/ci/branch.sh, release_tag.sh):
# the Java the game runs on (CI installs it next to JDK 25 for the Gradle daemon), the CurseForge game versions of
# the Fabric jar (comma separated, fabric_minecraft_dependency), whether a NeoForge release of this branch becomes the
# latest GitHub release (master only)
java_version=25
fabric_game_versions=26.2
release_make_latest=false
# Fabric (fabric.mod.json "depends" syntax). M52d: 26.2 only (Mojang has no 26.2.x)
fabric_minecraft_dependency=26.2
# Version we build against (M52d: the newest NeoForge for 26.2). The declared runtime range is neo_version_range.
neo_version=26.2.0.95
neo_version_range=[26.2.0.95,)
loader_version_range=[4,)

mod_id=bettacraft
mod_name=Bettacraft
mod_license=MIT
mod_version=1.57.0-beta.1
mod_group_id=org.overengineer.bettacraft
mod_authors=0verEngineer
# the mod page shown by the loaders (neoforge.mods.toml displayURL, fabric.mod.json contact.homepage)
mod_homepage=https://www.curseforge.com/minecraft/mc-mods/bettacraft
mod_description=Betta fish with Mendel genetics and realistic breeding: catch wild bettas in swamps, keep them in multiblock aquariums of any glass with heaters, coolers, filters, feeder and light, care for the water quality, breed live food, and build the inside of the aquarium block by block. Optional support for GuideME, JEI, Jade, The One Probe, WTHIT and other aquarium mods.

junit_version=5.11.3
# optional integrations (compileOnly)
jade_version=26.2.10+neoforge
guideme_version=26.2.2-alpha
jei_version=30.48.0.244
# The One Probe and WTHIT (M8): not part of ATM10, latest releases for 26.1.2 (M52c)
top_version=26.2_neo-15.0.2
top_fabric_version=26.2-15.0.2-fabric
wthit_version=neo-20.0.1
# M52: the Fabric builds of the overlay / recipe viewer mods (Modrinth version numbers; M52c: 26.1.2, no EMI there)
jade_fabric_version=26.2.11+fabric
jei_fabric_version=30.48.0.244
wthit_fabric_version=fabric-20.0.1
rei_fabric_version=26.2.820+fabric
architectury_fabric_version=21.1.13+fabric
badpackets_version=neo-0.12.3
badpackets_fabric_version=fabric-0.12.3
# Create (M32 part c): no build for 1.21.11 (M52b) or 26.1.2 (M52c), its integration rests on this branch
# aquarium mods for the dev runtime (M7; not compiled against). M52c: on 26.1.2 only Fish of Thieves and Aquaculture 2 exist
# (Better Fish Tanks, Fintastic and Naturalist have no 26.1.2 build)
# M52-final: Better Fish Tanks (26.2, CurseForge file id) and its library MINT Lib (Modrinth version)
bft_file_id=9371907
mint_lib_version=0.5.2-NeoForge-26.2
fish_of_thieves_version=26.2.2.0-neoforge
fish_of_thieves_fabric_version=26.2.2.0-fabric
yacl_version=3.9.7+26.2-neoforge
aquaculture_version=2.10.2

# ---- M52: multiloader
# vanilla Minecraft for the common module (ModDevGradle in NeoForm mode)
neo_form_version=26.2-2
# Forge Config API Port: NeoForge's ModConfigSpec for the common code (on Fabric also at runtime)
forgeconfigapiport_version=26.2.1

# ---- M52: Fabric (fabric/), M52c: 26.1.2. Mod versions from the official mavens / Modrinth version ids.
fabric_loader_version=0.20.1
fabric_api_version=0.161.0+26.2
# Team Reborn Energy (the energy API of Fabric; bundled in the Fabric jar)
teamreborn_energy_version=5.0.0
modmenu_version=20.0.3
# M52b/M52c: Modonomicon for Fabric 26.1.2 (the handbook on Fabric, as on Fabric 1.21.11)
# (the Modrinth version id: NeoForge and Fabric builds share the version number 26.1.2-2.20.2, the number alone resolves to the NeoForge jar)
modonomicon_fabric_version=pcUaUvgw

# ---- M59: ports of the dev servers (never the default 25565, a real server may hold it; each branch its own)
dev_server_port=25585
dev_fabric_server_port=25586
