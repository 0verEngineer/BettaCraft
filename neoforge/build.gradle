// background client runs need the FML early loading window off (it would be created, focused, before any mod code)
def fmlToml = rootProject.file(runRoot + '/config/fml.toml')
def background = project.hasProperty('background') || project.properties.keySet().any { it.startsWith('smoketest') || it == 'showcasetour' || it == 'showcasebench' }
// M56: a fresh run dir has no options.txt and the client would open the accessibility onboarding (narrator) first:
// seed one that skips it (muted unless -Psound; the dev clients mute through BackgroundSoundMixin anyway)
def seedOptions = { File dir ->
    def f = new File(dir, 'options.txt')
    if (f.exists()) return
    dir.mkdirs()
    f.setText(['onboardAccessibility:false', 'narrator:0'].plus(project.hasProperty('sound') ? [] : ['soundCategory_master:0.0']).join(System.lineSeparator()), 'UTF-8')
}
tasks.matching { it.name == 'runClient' }.configureEach { t ->
    t.doFirst {
        seedOptions(t.hasProperty('gameDirectory') ? t.gameDirectory.get().asFile : t.workingDir)
        // M59: a fresh run dir has no fml.toml yet: seed it, or the first background client opens the focused early window
        if (!fmlToml.exists() && background) {
            fmlToml.parentFile.mkdirs()
            fmlToml.setText('earlyWindowControl = false\n', 'UTF-8')
        }
        if (fmlToml.exists()) {
            def text = fmlToml.getText('UTF-8')
            def want = "earlyWindowControl = ${!background}"
            def updated = text.replaceAll(/earlyWindowControl = (true|false)/, want)
            if (updated != text) fmlToml.setText(updated, 'UTF-8')
        }
        // M52d: NeoForge 26.2 warns about the deprecated logoFile of other mods (YACL) on a screen that waits for a click;
        // background runs have nobody to click it
        def neoClient = rootProject.file(runRoot + '/config/neoforge-client.toml')
        // M59: a fresh run dir has no neoforge-client.toml yet: seed it with the warnings off
        if (background && !neoClient.exists()) {
            neoClient.parentFile.mkdirs()
            neoClient.setText('showLoadWarnings = false\n', 'UTF-8')
        }
        if (background && neoClient.exists()) {
            def text = neoClient.getText('UTF-8')
            def updated = text.replaceAll(/showLoadWarnings = true/, 'showLoadWarnings = false')
            if (updated != text) neoClient.setText(updated, 'UTF-8')
        }
    }
}
tasks.matching { it.name in ['runClient', 'runServer', 'runData', 'runGameTestServer'] }.configureEach { t ->
    def target = t.name == 'runGameTestServer' ? gameTestModsDir : runModsDir
    def plan = extraMods.collect { g -> [jars: (g.dir.listFiles() ?: []).findAll { it.name.endsWith('.jar') }, add: g.on && t.name in g.tasks,
            // M53: -PmodsExclude=iris,distanthorizons leaves the jars starting with these names out (the render matrix: Sodium without Iris)
            skip: (t.name == 'runClient' ? (g.notOnClient ?: []) : []) + (project.findProperty('modsExclude') ?: '').toString().tokenize(',')] }
    t.doFirst {
        target.mkdirs()
        // a library in two groups (TerraBlender, GeckoLib) stays when one of them is on
        def wanted = plan.findAll { it.add }.collectMany { g -> g.jars.findAll { j -> !g.skip.any { j.name.startsWith(it) } }*.name } as Set
        plan.each { g ->
            g.jars.each { jar ->
