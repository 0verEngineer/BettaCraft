            }
            // gradlew runClient -Psmoketestm14 : only the M14 scene (shrimp, crayfish, snails, frogs, algae)
            if (project.hasProperty('smoketestm14')) {
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m14only', 'true'
            }
