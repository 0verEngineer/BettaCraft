// ---- M59: server files, test worlds and reference worlds, so that a fresh clone runs every test without manual work
// The dev servers never take the default port 25565 (a real server may hold it): dev_server_port of gradle.properties.
def devServerPort = (project.findProperty('dev_server_port') ?: '25599').toString()
def seedServerFiles = { File dir, boolean offline ->
    dir.mkdirs()
    def eula = new File(dir, 'eula.txt')
    if (!eula.exists()) eula.text = 'eula=true\n'
    def sp = new File(dir, 'server.properties')
    def lines = sp.exists() ? sp.readLines('UTF-8') : []
    def set = { String k, String v -> lines = lines.findAll { !it.startsWith(k + '=') } + ["${k}=${v}".toString()] }
    def get = { String k -> lines.find { it.startsWith(k + '=') }?.substring(k.length() + 1) }
    boolean changed = !sp.exists()
    if (get('server-port') in [null, '', '25565']) { set('server-port', devServerPort); changed = true }
    if (offline && get('online-mode') != 'false') { set('online-mode', 'false'); changed = true }
    // the dev clients Dev1 / Dev2 are on no list (26.3 writes a new server.properties with white-list=true)
    if (offline && get('white-list') != 'false') { set('white-list', 'false'); changed = true }
    if (!sp.exists() && !offline) set('online-mode', 'false')
    if (changed) {
        sp.write(lines.join('\n') + '\n', 'UTF-8')
        logger.lifecycle("server files: ${sp} (port ${get('server-port')}, online-mode ${get('online-mode')})")
    }
}
// Every world a test run makes is deleted before the run and after a successful one (-PkeepWorld keeps it for debugging; a
// failed run keeps it until the next run). Only fixed names the runs make themselves, never the showcase or a world of the user.
def keepWorld = project.hasProperty('keepWorld')
def smokeRun = project.properties.keySet().any { it.startsWith('smoketest') }
def deleteWorlds = { String when, List<File> dirs ->
    dirs.each { d ->
        if (d.exists()) {
            if (!d.deleteDir()) throw new GradleException("cannot delete the test world ${d}")
            logger.lifecycle("test world deleted ${when}: ${d}")
        }
    }
}
def testWorlds = { Task t, Closure<List<File>> dirs ->
    t.doFirst { deleteWorlds('before the run', dirs()) }
    t.doLast { if (keepWorld) logger.lifecycle("-PkeepWorld: kept ${dirs()}") else deleteWorlds('after the run', dirs()) }
}
def smokeSaves = { File saves -> (saves.listFiles() ?: []).findAll { it.isDirectory() && it.name.startsWith('bettacraft_smoketest_') } }
tasks.matching { it.name == 'runServer' }.configureEach { t ->
    t.doFirst { seedServerFiles(rootProject.file(runRoot), false) }
    // the world of the server smoke (run/world, with -Pbiomes run/world_biomes) and the copy of -PsmoketestOldWorld
    if (smokeRun) {
        testWorlds(t) { [rootProject.file(runRoot + '/world'), rootProject.file(runRoot + '/world_biomes')] }
        // the copy of -PsmoketestOldWorld is made by a doFirst of its own that runs before this one: deleted only after the run
        t.doLast { if (!keepWorld) deleteWorlds('after the run', [rootProject.file(runRoot + '/oldworld_check')]) }
    }
}
tasks.matching { it.name == 'runClient' }.configureEach { t ->
    // the worlds the client smoke scenes create (bettacraft_smoketest_<time>); the showcase and the user's worlds stay
    if (smokeRun) testWorlds(t) { smokeSaves(rootProject.file(runRoot + '/saves')) }
}

// M59: the upgrade reference worlds are built, not stored: tools/upgrade/references.json names the commit (and script) of
// each world; a missing one is built by tools/upgrade/build_reference.sh / chain.sh (a git worktree of that commit next to
// this checkout, its own buildShowcase; several minutes).
def referencesFile = rootProject.file('tools/upgrade/references.json')
def bashExe = {
    if (!System.getProperty('os.name').toLowerCase().contains('windows')) return 'bash'
    // Git for Windows' bash (System32\bash.exe would be WSL): <git>/mingw64/libexec/git-core -> <git>/bin/bash.exe
    try {
        def p = new ProcessBuilder('git', '--exec-path').redirectErrorStream(true).start()
        def out = p.inputStream.text.trim()
        p.waitFor()
        def b = new File(new File(out).parentFile?.parentFile?.parentFile, 'bin/bash.exe')
        if (b.isFile()) return b.absolutePath
    } catch (Exception ignored) {
    }
    'bash'
}
def ensureReferenceWorld
ensureReferenceWorld = { String name, File saves ->
    if (new File(saves, "${name}/bettacraft_reference.json").exists()) return
    def w = referencesFile.exists() ? new groovy.json.JsonSlurper().parse(referencesFile).worlds?.get(name) : null
    if (w == null) throw new GradleException("reference world missing: ${new File(saves, name)}; tools/upgrade/references.json does not say how to build it")
    if (w.from) ensureReferenceWorld(w.from.toString(), saves)
    def chain = w.script == 'chain.sh'
    def args = chain ? [w.commit, w.from, name] : [w.commit, name]
    def log = rootProject.file("build/upgrade-reference/${name.replaceAll(/[^A-Za-z0-9._-]/, '_')}.log")
    log.parentFile.mkdirs()
    logger.lifecycle("building the reference world '${name}' with commit ${w.commit} (tools/upgrade/${w.script}, several minutes), log ${log}")
    def pb = new ProcessBuilder([bashExe(), "tools/upgrade/${w.script}".toString()] + args.collect { it.toString() })
            .directory(rootProject.projectDir).redirectErrorStream(true).redirectOutput(log)
    // a worktree of its own per checkout (several clones side by side must not share one)
    pb.environment().put('UPGRADE_WORKTREE', new File(rootProject.projectDir.parentFile, "${rootProject.projectDir.name}-upgrade-${chain ? 'chain' : 'ref'}").absolutePath)
    def p = pb.start()
    if (!p.waitFor(60, java.util.concurrent.TimeUnit.MINUTES)) {
        p.destroyForcibly()
        throw new GradleException("building the reference world '${name}' took over an hour, see ${log}")
    }
    if (p.exitValue() != 0 || !new File(saves, "${name}/bettacraft_reference.json").exists()) {
        throw new GradleException("building the reference world '${name}' failed (exit ${p.exitValue()}), see ${log}")
    }
    logger.lifecycle("reference world built: ${new File(saves, name)}")
}
def defaultReference = {
    referencesFile.exists() ? new groovy.json.JsonSlurper().parse(referencesFile).default?.toString() : null
}

// -PsmoketestOldWorld: a fresh copy of the old world for every run (the original in run/saves stays untouched). M59: by default
// the upgrade reference world of this branch (built if missing); -PoldWorld="Bettacraft Testwelt M11" for another one
def oldWorldName = (project.findProperty('oldWorld') ?: defaultReference() ?: 'Bettacraft Testwelt M11').toString()
tasks.matching { it.name == 'runServer' }.configureEach { t ->
    if (project.hasProperty('smoketestOldWorld')) {
        def src = rootProject.file("${runRoot}/saves/${oldWorldName}")
        def dst = rootProject.file(runRoot + '/oldworld_check')
        t.doFirst {
            if (!src.isDirectory() && !project.hasProperty('oldWorld')) ensureReferenceWorld(oldWorldName, src.parentFile)
            if (!src.isDirectory()) throw new GradleException("old world not found: ${src}")
            dst.deleteDir()
            java.nio.file.Files.walk(src.toPath()).forEach { from ->
                def rel = src.toPath().relativize(from)
                def to = dst.toPath().resolve(rel)
                if (java.nio.file.Files.isDirectory(from)) java.nio.file.Files.createDirectories(to)
                else if (from.fileName.toString() != 'session.lock') java.nio.file.Files.copy(from, to)
            }
        }
    }
}

// gradlew runMultiplayerTest : multiplayer smoke test. Starts the dedicated server (run/, dev world, with the stage of
// DevSmokeMP) and, once it is up, two clients in the background (unfocused, second monitor) as Dev1 and Dev2 with game
// directories of their own (run/client1, run/client2: options and configs copied from run/, sound off, 30 fps) that join
// it and follow the script (DevClientSmokeMP). The game processes are started directly from the java command lines of
// runServer / runClient (no second Gradle build that would wait for the first one's locks). Logs: build/mptest/*.log,
// screenshots: run/client1|2/screenshots/mp_*.png. Fails unless the server logs "MP PASSED" and both clients finish.
tasks.register('runMultiplayerTest') {
    group = 'verification'
    description = 'Dedicated server + two background clients (Dev1, Dev2): multiplayer smoke test (plants, net, menu, sync)'
    notCompatibleWithConfigurationCache('starts the game processes of runServer and runClient')
    dependsOn 'prepareServerRun', 'prepareClientRun'
    dependsOn { [tasks.named('runServer').get().classpathProvider, tasks.named('runClient').get().classpathProvider] }
    doLast {
        def srv = tasks.named('runServer').get()
        def cli = tasks.named('runClient').get()
        def java = srv.javaLauncher.get().executablePath.asFile.absolutePath
        def logs = rootProject.file('build/mptest')
        logs.deleteDir()
        logs.mkdirs()
        def runDir = rootProject.file(runRoot)
        // the extra mods of -Pshaders / -Ppower / -Paquatic / -Pbiomes / -Pstorage are not part of this test; M50: -Pcreate puts
        // Create, Create Aeronautics and Sable on the server and both clients (a tank turns on a bearing, DevSmokeMP)
        def mpCreate = project.hasProperty('create')
        // M52d: the groups of this branch's run root (run/<minecraft>/...; the list named the 1.21.1 folders under run/)
        ['shader-mods', 'power-mods', 'aquatic-mods', 'biome-mods', 'storage-mods', 'create-mods', 'quest-mods', 'map-mods', 'perf-mods', 'kubejs-mods', 'facade-mods', 'pipe-mods', 'compare-mods', 'integration-mods', 'zoo-mods', 'local-mods'].collect { runRoot + '/' + it }.each { d ->
            (rootProject.file(d).listFiles() ?: []).findAll { it.name.endsWith('.jar') }.each { j ->
                ['mods', 'client1/mods', 'client2/mods'].each { m ->
                    def dst = new File(runDir, "${m}/${j.name}")
                    if (mpCreate && d == runRoot + '/create-mods') {
                        dst.parentFile.mkdirs()
                        java.nio.file.Files.copy(j.toPath(), dst.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    } else dst.delete()
                }
            }
        }
        // M59: the server files are written here (offline mode: the dev clients have no account; not the default port)
        seedServerFiles(runDir, true)
        def props = new Properties()
        def sp = new File(runDir, 'server.properties')
        sp.withInputStream { props.load(it) }
        def port = props.getProperty('server-port', devServerPort)
        deleteWorlds('before the run', [new File(runDir, 'world')])
        def cmd = { t, String name, List extraJvm, List extraArgs ->
            // the class path goes into an argument file (the Windows command line is limited to 32k characters)
            def cp = new File(logs, "${name}.classpath.txt")
            cp.write('-cp\n' + t.classpathProvider.files.collect { it.absolutePath.replace('\\', '/') }.join(File.pathSeparator) + '\n', 'UTF-8')
            ([java] + t.allJvmArgs + extraJvm + ["@${cp.absolutePath}", t.mainClass.get()] + t.args + extraArgs).collect { it.toString() }
        }
        def start = { String name, List command, File dir ->
            dir.mkdirs()
            def p = new ProcessBuilder(command).directory(dir).redirectErrorStream(true).redirectOutput(new File(logs, "${name}.log")).start()
            logger.lifecycle("started ${name} (pid ${p.pid()}) in ${dir}")
            p
        }
        def clientDir = { int n ->
            def dir = new File(runDir, "client${n}")
            dir.mkdirs()
            def cfgFrom = new File(runDir, 'config').toPath()
            if (java.nio.file.Files.isDirectory(cfgFrom)) {
                java.nio.file.Files.walk(cfgFrom).forEach { from ->
                    def to = new File(dir, 'config').toPath().resolve(cfgFrom.relativize(from).toString())
                    if (java.nio.file.Files.isDirectory(from)) java.nio.file.Files.createDirectories(to)
                    else if (!from.fileName.toString().endsWith('.bak')) java.nio.file.Files.copy(from, to, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }
            // background client: no FML early window (it would take the focus before any mod code runs)
            def fml = new File(dir, 'config/fml.toml')
            if (!fml.exists()) { fml.parentFile.mkdirs(); fml.setText('earlyWindowControl = false\n', 'UTF-8') } // M59: fresh run dir
            // M59: no load-warning screen (NeoForge 26.2+ waits there for a click: the deprecated logoFile of YACL)
            def neoCfg = new File(dir, 'config/neoforge-client.toml')
            if (!neoCfg.exists()) neoCfg.setText('showLoadWarnings = false\n', 'UTF-8')
            else neoCfg.setText(neoCfg.getText('UTF-8').replaceAll(/showLoadWarnings = true/, 'showLoadWarnings = false'), 'UTF-8')
            if (fml.exists()) fml.setText(fml.getText('UTF-8').replaceAll(/earlyWindowControl = (true|false)/, 'earlyWindowControl = false'), 'UTF-8')
            def set = [lang: 'en_us', maxFps: '30', renderDistance: '6', simulationDistance: '5', soundCategory_master: '0.0',
                       pauseOnLostFocus: 'false', onboardAccessibility: 'false', guiScale: '3', skipMultiplayerWarning: 'true',
                       joinedFirstServer: 'true', tutorialStep: 'none', fullscreen: 'false', narrator: '0']
            def src = new File(runDir, 'options.txt')
            def lines = src.exists() ? src.readLines('UTF-8') : []
            def out = lines.findAll { l -> !set.keySet().any { l.startsWith(it + ':') } } + set.collect { k, v -> "${k}:${v}".toString() }
            new File(dir, 'options.txt').write(out.join('\n') + '\n', 'UTF-8')
            dir
        }
        def procs = []
        def deadline = System.currentTimeMillis() + 14 * 60 * 1000L
        try {
            // M42 part b: -Pmplag puts a bad connection between the server and each client (DevNetLag: 40-250 ms both ways, every
            // second interior delta lost)
            def serverJvm = ['-Dbettacraft.smoketest.mp=true'] + (project.hasProperty('mplag') ? ['-Dbettacraft.mp.lag=true'] : [])
            def server = start('server', cmd(srv, 'server', serverJvm, []), runDir)
            procs << server
            def serverLog = new File(logs, 'server.log')
            while (!(serverLog.exists() && serverLog.getText('UTF-8').contains('Done ('))) {
                if (!server.isAlive()) throw new GradleException("the server stopped while starting, see ${serverLog}")
                if (System.currentTimeMillis() > deadline - 11 * 60 * 1000L) throw new GradleException('the server did not start in 3 minutes')
                Thread.sleep(1000)
            }
            logger.lifecycle("server is up on port ${port}")
            [1, 2].each { n ->
                procs << start("client${n}", cmd(cli, "client${n}", ['-Dbettacraft.smoketest.mp=true', '-Dbettacraft.background=true',
                        "-Dbettacraft.smoketest.mp.address=localhost:${port}".toString()], ['--username', "Dev${n}".toString()]), clientDir(n))
                Thread.sleep(5000) // do not start both at the same moment (CPU, the second monitor)
            }
            while (procs.any { it.isAlive() } && System.currentTimeMillis() < deadline) Thread.sleep(1000)
            if (procs.any { it.isAlive() }) logger.error('runMultiplayerTest: timed out, stopping the game processes')
        } finally {
            procs.each { if (it.isAlive()) it.destroyForcibly() }
        }
        def text = { String n -> def f = new File(logs, "${n}.log"); f.exists() ? f.getText('UTF-8') : '' }
        def problems = []
        if (!text('server').contains('[smoketest] MP PASSED')) problems << 'server: no "[smoketest] MP PASSED" (see the "MP check failed" lines)'
        ['client1', 'client2'].each { c -> if (!text(c).contains('client finished')) problems << "${c}: did not finish the script".toString() }
        ['server', 'client1', 'client2'].each { n ->
            def lines = text(n).readLines()
            def errors = lines.findIndexValues { (it.contains('/ERROR]') && !it.contains('Missing translations')) || it =~ /^\S*(Exception|Error)\b/ }
            def ours = lines.findAll { it.contains('org.overengineer') && (it.trim().startsWith('at ') || it.contains('Exception')) }
            logger.lifecycle("${n}: ${errors.size()} error line(s), ${ours.size()} line(s) of a Bettacraft stack trace")
            lines.findAll { it.contains('[smoketest] MP') && (it.contains('failed') || it.contains('FAILED') || it.contains('PASSED')) }.each { logger.lifecycle("  ${it}") }
            if (!ours.isEmpty()) problems << "${n}: Bettacraft exception, e.g. ${ours.first().trim()}".toString()
        }
        [1, 2].each { n -> (new File(runDir, "client${n}/screenshots").listFiles() ?: []).findAll { it.name.startsWith('mp_') }.sort { it.name }.each { logger.lifecycle("screenshot ${it}") } }
        if (!problems.isEmpty()) throw new GradleException('runMultiplayerTest failed:\n  ' + problems.join('\n  ') + "\nlogs in ${logs}")
        if (keepWorld) logger.lifecycle("-PkeepWorld: kept ${new File(runDir, 'world')}") else deleteWorlds('after the run', [new File(runDir, 'world')])
        logger.lifecycle("runMultiplayerTest PASSED (logs in ${logs})")
    }
}

// gradlew buildShowcase : (re)builds the showcase world "Bettacraft Schaukasten" in run/saves from scratch (M21). A
// dedicated server without a window (game directory run/showcase with its own server.properties: flat world, creative,
// peaceful) creates the world, DevShowcase builds the rows of tanks, the world is saved and the server stops. Open it in
// the dev client (Singleplayer). Log: build/showcase/server.log. Not copied anywhere else.
tasks.register('buildShowcase') {
    group = 'bettacraft'
    description = 'Builds the showcase world "Bettacraft Schaukasten" (run/saves) with a dedicated server, no window'
    notCompatibleWithConfigurationCache('starts the game process of runServer')
    dependsOn 'prepareServerRun'
    dependsOn { tasks.named('runServer').get().classpathProvider }
    doLast {
        def srv = tasks.named('runServer').get()
        def java = srv.javaLauncher.get().executablePath.asFile.absolutePath
        def logs = rootProject.file('build/showcase')
        logs.deleteDir()
        logs.mkdirs()
        def dir = rootProject.file(runRoot + '/showcase')
        dir.mkdirs()
        def saves = rootProject.file(runRoot + '/saves')
        saves.mkdirs()
        // M58: -PshowcaseWorld=<name> builds the showcase under another name (the default one stays untouched)
        def worldName = project.hasProperty('showcaseWorld') ? project.property('showcaseWorld').toString() : 'Bettacraft Schaukasten'
        def world = new File(saves, worldName)
        world.deleteDir()
        new File(dir, 'eula.txt').write('eula=true\n', 'UTF-8')
        new File(dir, 'server.properties').write([
                'online-mode=false', 'level-type=minecraft:flat', 'gamemode=creative', 'difficulty=peaceful', 'spawn-monsters=false',
                'spawn-animals=true', 'spawn-npcs=true', 'generate-structures=false', 'server-port=25599', 'spawn-protection=0',
                // spawn-animals must stay true: without it the server discards every water animal (our fish too); the gamerule
                // doMobSpawning is off instead
                'max-players=1', 'level-seed=21', 'allow-flight=true', 'enable-command-block=true',
                // M21.6: saving the big world can take longer than the watchdog's minute on a busy disk
                'max-tick-time=-1'].join('\n') + '\n', 'UTF-8')
        def cp = new File(logs, 'classpath.txt')
        cp.write('-cp\n' + srv.classpathProvider.files.collect { it.absolutePath.replace('\\', '/') }.join(File.pathSeparator) + '\n', 'UTF-8')
        def command = ([java] + srv.allJvmArgs + ['-Dbettacraft.showcase=true', "@${cp.absolutePath}".toString(), srv.mainClass.get()] + srv.args
                + ['--universe', saves.absolutePath, '--world', worldName]).collect { it.toString() }
        def log = new File(logs, 'server.log')
        def p = new ProcessBuilder(command).directory(dir).redirectErrorStream(true).redirectOutput(log).start()
        logger.lifecycle("showcase server started (pid ${p.pid()}), log ${log}")
        if (!p.waitFor(15, java.util.concurrent.TimeUnit.MINUTES)) {
            p.destroyForcibly()
            throw new GradleException("buildShowcase: the server did not finish in 15 minutes, see ${log}")
        }
        def text = log.getText('UTF-8')
        text.readLines().findAll { it.contains('[showcase]') }.each { logger.lifecycle("  ${it}") }
        if (!text.contains('SHOWCASE BUILT')) throw new GradleException("buildShowcase failed, see ${log}")
        logger.lifecycle("showcase world: ${world}")
    }
}

// gradlew smoketestUpgrade : M21.5 upgrade test. Copies the reference world built by an older version (run/saves/
// <-PupgradeWorld, default "Bettacraft Referenz 1.13.1">, made by tools/upgrade/build_reference.sh with 1.13.1-beta.1,
// commit 909d12a) to run/upgrade/saves, runs a dedicated server without a window on it twice (stage 1: compare with the
// reference manifest the old version wrote, save, snapshot; stage 2: load the saved world again and compare with the
// snapshot) and fails on a difference or on an ERROR / exception line in the logs. Logs: build/upgrade/stage{1,2}.log.
tasks.register('smoketestUpgrade') {
    group = 'verification'
    description = 'Loads the reference world of an older version and checks that nothing is lost (dedicated server, no window)'
    notCompatibleWithConfigurationCache('starts the game process of runServer')
    dependsOn 'prepareServerRun'
    dependsOn { tasks.named('runServer').get().classpathProvider }
    doLast {
        // M59: the default reference of this branch is named in tools/upgrade/references.json and built when missing
        def worldName = (project.findProperty('upgradeWorld') ?: defaultReference() ?: 'Bettacraft Referenz 26.2').toString()
        def src = rootProject.file("${runRoot}/saves/${worldName}")
        ensureReferenceWorld(worldName, src.parentFile)
        def srv = tasks.named('runServer').get()
        def java = srv.javaLauncher.get().executablePath.asFile.absolutePath
        def logs = rootProject.file('build/upgrade')
        logs.deleteDir()
        logs.mkdirs()
        def dir = rootProject.file(runRoot + '/upgrade')
        def saves = new File(dir, 'saves')
        def world = new File(saves, 'upgrade_check')
        world.deleteDir()
        saves.mkdirs()
        java.nio.file.Files.walk(src.toPath()).forEach { from ->
            def to = world.toPath().resolve(src.toPath().relativize(from))
            if (java.nio.file.Files.isDirectory(from)) java.nio.file.Files.createDirectories(to)
            else if (from.fileName.toString() != 'session.lock') java.nio.file.Files.copy(from, to)
        }
        new File(dir, 'eula.txt').write('eula=true\n', 'UTF-8')
        new File(dir, 'server.properties').write(['online-mode=false', 'server-port=25598', 'spawn-protection=0', 'spawn-animals=true',
                'spawn-npcs=true', 'max-players=1'].join('\n') + '\n', 'UTF-8')
        def cp = new File(logs, 'classpath.txt')
        cp.write('-cp\n' + srv.classpathProvider.files.collect { it.absolutePath.replace('\\', '/') }.join(File.pathSeparator) + '\n', 'UTF-8')
        // vanilla noise of the dev runtime (translations of other mods' blocks) is not an error of the upgrade
        def allowed = [~/Missing translations/, ~/Mismatch in destroy block pos/, ~/Ambiguity between arguments/]
        for (stage in [1, 2]) {
            def command = ([java] + srv.allJvmArgs + ["-Dbettacraft.smoketest.upgrade=${stage}".toString(), "@${cp.absolutePath}".toString(), srv.mainClass.get()]
                    + srv.args + ['--universe', saves.absolutePath, '--world', 'upgrade_check']).collect { it.toString() }
            def log = new File(logs, "stage${stage}.log")
            def p = new ProcessBuilder(command).directory(dir).redirectErrorStream(true).redirectOutput(log).start()
            logger.lifecycle("upgrade stage ${stage}: server started (pid ${p.pid()}), log ${log}")
            if (!p.waitFor(15, java.util.concurrent.TimeUnit.MINUTES)) {
                p.destroyForcibly()
                throw new GradleException("smoketestUpgrade: stage ${stage} did not finish in 15 minutes, see ${log}")
            }
            def text = log.getText('UTF-8')
            text.readLines().findAll { it.contains('[smoketest] upgrade') || it.contains('UPGRADE STAGE') }.each { logger.lifecycle("  ${it}") }
            def errors = text.readLines().findAll { (it.contains('/ERROR]') || it ==~ /^(Caused by:|java\.|net\.minecraft|org\.overengineer).*/) && !allowed.any { a -> it =~ a } }
            errors.take(20).each { logger.lifecycle("  LOG: ${it}") }
            if (!text.contains("UPGRADE STAGE ${stage} PASSED")) throw new GradleException("smoketestUpgrade: stage ${stage} failed, see ${log}")
            if (!errors.isEmpty()) throw new GradleException("smoketestUpgrade: ${errors.size()} error line(s) in ${log}")
        }
        if (keepWorld) logger.lifecycle("-PkeepWorld: kept ${world}") else deleteWorlds('after the run', [world])
        logger.lifecycle("UPGRADE TEST PASSED (${worldName})")
    }
}

// gradlew smoketestWorldCleanup : M59 proof that the server smoke cleans up after itself. Runs the smoke server twice in a row
// (the java command line of runServer with -Dbettacraft.smoketest=true, no window), measures its world after each run and
// deletes it the way runServer -Psmoketest does. Fails when a world is left over or the second run's world is bigger than the
// first's plus half (the interior regions of every smoke used to pile up in run/world: 18 GB). Logs: build/worldcleanup/.
tasks.register('smoketestWorldCleanup') {
    group = 'verification'
    description = 'Two server smokes in a row: the world is deleted after each and does not grow (M59)'
    notCompatibleWithConfigurationCache('starts the game process of runServer')
    dependsOn 'prepareServerRun'
    dependsOn { tasks.named('runServer').get().classpathProvider }
    doLast {
        def srv = tasks.named('runServer').get()
        def java = srv.javaLauncher.get().executablePath.asFile.absolutePath
        def dir = rootProject.file(runRoot)
        seedServerFiles(dir, false)
        def world = new File(dir, 'world')
        def logs = rootProject.file('build/worldcleanup')
        logs.deleteDir()
        logs.mkdirs()
        def cp = new File(logs, 'classpath.txt')
        cp.write('-cp\n' + srv.classpathProvider.files.collect { it.absolutePath.replace('\\', '/') }.join(File.pathSeparator) + '\n', 'UTF-8')
        def size = { File d ->
            d.exists() ? java.nio.file.Files.walk(d.toPath()).filter { java.nio.file.Files.isRegularFile(it) }.mapToLong { java.nio.file.Files.size(it) }.sum() : 0L
        }
        deleteWorlds('before the run', [world])
        def sizes = []
        for (n in [1, 2]) {
            def log = new File(logs, "run${n}.log")
            def command = ([java] + srv.allJvmArgs + ['-Dbettacraft.smoketest=true', "@${cp.absolutePath}".toString(), srv.mainClass.get()]
                    + srv.args.findAll { !(it in ['--world', 'world_biomes', 'oldworld_check']) }).collect { it.toString() }
            def p = new ProcessBuilder(command).directory(dir).redirectErrorStream(true).redirectOutput(log).start()
            logger.lifecycle("smoke ${n}: server started (pid ${p.pid()}), log ${log}")
            if (!p.waitFor(15, java.util.concurrent.TimeUnit.MINUTES)) {
                p.destroyForcibly()
                throw new GradleException("smoketestWorldCleanup: smoke ${n} did not finish in 15 minutes, see ${log}")
            }
            if (!log.getText('UTF-8').contains('[smoketest] PASSED')) throw new GradleException("smoketestWorldCleanup: smoke ${n} did not pass, see ${log}")
            sizes << size(world)
            logger.lifecycle("smoke ${n}: the world has ${String.format('%.1f', sizes[-1] / 1048576d)} MB")
            deleteWorlds('after the run', [world])
            if (world.exists()) throw new GradleException("smoketestWorldCleanup: ${world} is still there after smoke ${n}")
        }
        if (sizes[0] == 0L) throw new GradleException('smoketestWorldCleanup: the first smoke made no world (wrong directory?)')
        if (sizes[1] > sizes[0] * 1.5) throw new GradleException("smoketestWorldCleanup: the world grew from ${sizes[0]} to ${sizes[1]} bytes")
        logger.lifecycle("WORLD CLEANUP PASSED: smoke 1 left ${sizes[0]} bytes, smoke 2 ${sizes[1]} bytes, both deleted")
    }
}

// ---- M22: release checks (the same ones the release workflow runs) --------------------------------------------------

// MIT: the licence text goes into the jar; the workflows pick the release jars up from the root build/libs
def licenseModId = mod_id
tasks.named('jar', Jar).configure {
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    from(rootProject.file('LICENSE')) { rename { "LICENSE_${licenseModId}" } }
}

// gradlew verifyReleaseJar [-PexpectedVersion=1.2.3] : checks build/libs/bettacraft-<version>.jar before it is released:
//  - only allowed entries: our classes, assets/bettacraft, data/bettacraft, tags of other namespaces (c, minecraft, mods we
//    support), the NeoForge loot modifier list, mods.toml, mixin config, icon and logo, WTHIT plugin list, licence
//  - no development code: nothing of the dev source set (smoke tests, showcase, GameTests), no Dev*Smoke* / SmokeFreeze /
//    gametest classes, no GameTest templates, no source files of the asset tools (.bbmodel, .py ...), no file over 2 MB
//  - every mixin of bettacraft.mixins.json is in the jar
//  - the version in neoforge.mods.toml is mod_version (and -PexpectedVersion, e.g. the tag without "v", if given)
def verifyVersion = mod_version
def verifyModId = mod_id
def verifyMinecraft = minecraft_version // M52c: captured (the configuration cache has no project in the task action)
def verifyExpected = providers.gradleProperty('expectedVersion')
def verifyDevClasses = sourceSets.dev.output.classesDirs
def verifyJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Checks the release jar: no dev/smoke/GameTest classes, no foreign assets, version matches'
    dependsOn 'jar', 'devClasses'
    inputs.file(verifyJar)
    inputs.files(verifyDevClasses)
    inputs.property('expectedVersion', verifyExpected.orElse(''))
    def report = layout.buildDirectory.file('verifyReleaseJar.txt')
    outputs.file(report)
    doLast {
        def jarFile = verifyJar.get().asFile
        def problems = []
        // classes of the dev source set, as jar paths
        def devNames = [] as Set
        verifyDevClasses.files.each { root ->
            if (root.isDirectory()) root.eachFileRecurse { f ->
                if (f.isFile() && f.name.endsWith('.class')) devNames << root.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            }
        }
        def allowed = [
                ~/^META-INF\/(MANIFEST\.MF|neoforge\.mods\.toml)$/,
                // M52: the platform layer's implementations (ServiceLoader)
                ~/^META-INF\/services\/org\.overengineer\.bettacraft\.platform\.(Platform|client\.ClientPlatform)$/,
                ~/^(bettacraft(\.neoforge)?\.mixins\.json|bettacraft(_logo)?\.png|waila_plugins\.json|pack\.mcmeta|LICENSE_bettacraft)$/,
                ~/^org\/overengineer\/bettacraft\/.+\.class$/,
                ~/^assets\/bettacraft\/.+\.(json|png|mcmeta|md|nbt|ogg|txt)$/,
                ~/^data\/bettacraft\/.+\.(json|nbt|mcfunction)$/,
                ~/^data\/[a-z0-9_.-]+\/tags\/.+\.json$/,
                ~/^data\/neoforge\/loot_modifiers\/global_loot_modifiers\.json$/,
                ~/^data\/neoforge\/data_maps\/item\/compostables\.json$/, // M49: the Chaetomorpha goes into the composter
        ]
        def forbidden = [
                (~/(^|\/)Dev(Smoke|ClientSmoke|ClientShowcase|ClientHooks|Showcase|Upgrade)[^\/]*\.class$/): 'development class',
                (~/(^|\/)SmokeFreeze[^\/]*\.class$/)                                    : 'smoke test helper',
                (~/^org\/overengineer\/bettacraft\/gametest\//)                          : 'GameTest class',
                (~/GameTests?(\$[^\/]*)?\.class$/)                                       : 'GameTest class',
                (~/^data\/bettacraft\/structure\/empty_[^\/]*\.nbt$/)                     : 'GameTest template',
                (~/\.(bbmodel|py|pyc|blend|psd|xcf|kra|java|sh|bat|jar|zip)$/)          : 'source or archive file',
        ]
        def toml = null
        def mixinConfigs = [:]
        def classes = [] as Set
        def count = 0
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { e ->
                if (e.directory) return
                count++
                def n = e.name
                if (n.endsWith('.class')) classes << n
                if (!allowed.any { n ==~ it }) problems << "not allowed in the jar: ${n}".toString()
                forbidden.each { re, what -> if (n =~ re) problems << "${what}: ${n}".toString() }
                if (devNames.contains(n)) problems << "class of the dev source set: ${n}".toString()
                if (e.size > 2L * 1024 * 1024) problems << "bigger than 2 MB: ${n} (${e.size} bytes)".toString()
                if (n == 'META-INF/neoforge.mods.toml') toml = zip.getInputStream(e).getText('UTF-8')
                if (n ==~ /bettacraft(\.neoforge)?\.mixins\.json/) mixinConfigs[n] = zip.getInputStream(e).getText('UTF-8')
            }
        }
        if (toml == null) problems << 'META-INF/neoforge.mods.toml missing'
        else {
            def m = toml =~ /(?m)^version="([^"]*)"/
            def inJar = m.find() ? m.group(1) : null
            if (inJar != verifyVersion) problems << "neoforge.mods.toml has version ${inJar}, mod_version is ${verifyVersion}".toString()
            if (toml.contains('${')) problems << 'neoforge.mods.toml has an unexpanded placeholder'
        }
        def expected = verifyExpected.getOrElse('')
        if (!expected.isEmpty() && expected != verifyVersion) {
            problems << "expected version ${expected} (tag), but mod_version is ${verifyVersion}".toString()
        }
        if (jarFile.name != "${verifyModId}-neoforge-${verifyMinecraft}-${verifyVersion}.jar".toString()) problems << "unexpected jar name ${jarFile.name}".toString()
        ["${verifyModId}.mixins.json", "${verifyModId}.neoforge.mixins.json"].each { String name ->
            def json = mixinConfigs[name]
            if (json == null) { problems << "${name} missing".toString(); return }
            def cfg = new groovy.json.JsonSlurper().parseText(json)
            def pkg = cfg.package.replace('.', '/')
            ((cfg.mixins ?: []) + (cfg.client ?: []) + (cfg.server ?: [])).each { String mx ->
                if (!classes.contains("${pkg}/${mx.replace('.', '/')}.class".toString())) problems << "mixin ${mx} of ${name} is not in the jar".toString()
            }
        }
        def out = report.get().asFile
        out.parentFile.mkdirs()
        out.write("${jarFile.name}: ${count} files, ${classes.size()} classes, ${problems.size()} problem(s)\n" + problems.collect { "  ${it}\n" }.join(''), 'UTF-8')
        if (!problems.isEmpty()) throw new GradleException("verifyReleaseJar: ${problems.size()} problem(s) in ${jarFile.name}:\n  " + problems.take(40).join('\n  '))
        logger.lifecycle("verifyReleaseJar: ${jarFile.name} OK (${count} files, ${classes.size()} classes, version ${verifyVersion})")
    }
}

tasks.named('check').configure { dependsOn 'verifyReleaseJar' }

// M42: the optional integration suite, not part of build or check and not of the normal runGameTestServer: the whole GameTest
// suite plus the integration-only tests (gametest/integration) with every integrated mod (see -Pintegration above), in
// run/gametest-integration. Run by hand (gradlew integrationTests --no-configuration-cache) or in CI only from the manual
// workflow integration.yml. The groups' jars are downloaded by the manifest dev-mods.json (M59), see the README.
// M42: a GameTest server that fails to start (a mod missing a dependency, a crash while loading) ends with exit code 0, and
// the task looked green; the run counts only when the server reported its result line
// M42 part b: the GameTest server never deleted its world, so every run added the region files of its new random test positions
// (over and interior dimension) to the last runs': run/gametest/world had grown to 7,000 + 150,000 region files and filled the
// disk. Each run starts with a fresh world now.
tasks.matching { it.name == 'runGameTestServer' }.configureEach { t ->
    def log = rootProject.file(gameTestDir + '/logs/latest.log')
    def world = rootProject.file(gameTestDir + '/world')
    t.doFirst {
        if (world.exists() && !world.deleteDir()) throw new GradleException("cannot delete the old GameTest world ${world}")
    }
    t.doLast {
        def text = log.exists() ? log.getText('UTF-8') : ''
        if (!(text =~ /All \d+ required tests passed/)) {
            throw new GradleException("the GameTest server reported no result (did it start? see ${log})")
        }
        // M59: the world of a run that passed goes too (-PkeepWorld keeps it)
        if (keepWorld) logger.lifecycle("-PkeepWorld: kept ${world}") else deleteWorlds('after the run', [world])
    }
}

tasks.register('integrationTests') {
    group = 'bettacraft'
    description = 'GameTests with every integrated mod, including the integration-only tests (M42, optional)'
    dependsOn 'runGameTestServer'
}

// M42 part b: the zoo, the second part of the optional suite: the whole GameTest suite plus the zoo tests (gametest/zoo) with the
// mods we do not integrate (run/zoo-mods) and the groups aquatic, biomes and create, in run/gametest-zoo. The tests write their
// findings to run/gametest-zoo/zoo/*.tsv. Run by hand: gradlew zooTests --no-configuration-cache
tasks.register('zooTests') {
    group = 'bettacraft'
    description = 'GameTests with mods we do not integrate (animals, water plants), including the zoo tests (M42, optional)'
    dependsOn 'runGameTestServer'
}
