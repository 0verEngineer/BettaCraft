// M52: the NeoForge mod. Compiles the common sources (common/src/main) together with the NeoForge platform layer and
// glue of this module (neoforge/src/main) into one jar; the dev source set (smoke scenes, showcase, GameTests) is
// neoforge/src/dev. The run directories stay in the repository root (run/, run/gametest ...).
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'idea'
}

version = mod_version
group = mod_group_id

def commonProject = project(':common')
sourceSets.main.java.srcDir(commonProject.file('src/main/java'))
sourceSets.main.resources {
    srcDir(commonProject.file('src/main/resources'))
    // Resources produced by the data generators (runData)
    srcDir(commonProject.file('src/generated/resources'))
    exclude('**/*.bbmodel')
    exclude('.cache')
}

// M52: the JUnit tests live in common/src/test (loader-independent) and run here, with NeoForge's real config classes
sourceSets.test.java.srcDir(commonProject.file('src/test/java'))
sourceSets.test.resources.srcDir(commonProject.file('src/test/resources'))

base {
    // bettacraft-neoforge-26.1.2-<mod_version>.jar
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

// M22: development-only code in its own source set src/dev (smoke tests DevSmoke* / DevClientSmoke*, the showcase world,
// GameTests and their template). It is part of the mod in every gradlew run* task (same packages, merged into the one mod
// bettacraft by the mods block below), but not of the jar: the released jar holds only src/main (verifyReleaseJar checks).
sourceSets {
    dev {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
// M52b: Create has no 1.21.11 build. The classes that extend Create's (and the tests and smoke scenes of it) are left out
// of this branch; its reflection part (common compat/create) finds no Create and stays off.
def createClasses = ['CreateDisplays', 'CreateDrive', 'CreateTravel', 'CreateTravelClient', 'DriveAdapterBlock',
                     'DriveAdapterBlockEntity', 'DriveAdapterRenderer'].collect { "org/overengineer/bettacraft/compat/create/${it}.java".toString() }
sourceSets.main.java.exclude(createClasses)
sourceSets.dev.java.exclude(['org/overengineer/bettacraft/gametest/CreateDeviceGameTests.java',
                             'org/overengineer/bettacraft/gametest/CreateTravelGameTests.java',
                             'org/overengineer/bettacraft/gametest/CreateDriveGameTests.java',
                             'org/overengineer/bettacraft/gametest/CreateGameTests.java',
                             'org/overengineer/bettacraft/client/DevClientSmokeM32c.java'])
// M52b: the GameTest classes of the normal suite (every class with @GameTestHolder) for BettaGameTests, which registers them
// on the data-driven GameTest system of 1.21.5+ (NeoForge no longer scans the annotation)
def gameTestListDir = layout.buildDirectory.dir('generated/devresources')
sourceSets.dev.resources.srcDir(gameTestListDir)
tasks.register('gameTestList') {
    def out = gameTestListDir.map { it.file('bettacraft_gametests.txt') }
    def src = file('src/dev/java')
    def excluded = sourceSets.dev.java.excludes
    inputs.dir(src)
    outputs.file(out)
    doLast {
        def names = []
        src.eachFileRecurse { f ->
            if (!f.name.endsWith('.java')) return
            def rel = src.toPath().relativize(f.toPath()).toString().replace(File.separator, '/')
            if (rel in excluded) return
            def text = f.getText('UTF-8')
            if (!(text =~ /(?m)^@GameTestHolder/)) return
            def pkg = (text =~ /(?m)^package ([\w.]+);/)[0][1]
            names << pkg + '.' + (f.name - '.java')
        }
        names.sort()
        out.get().asFile.parentFile.mkdirs()
        out.get().asFile.text = names.join(System.lineSeparator()) + System.lineSeparator()
        logger.lifecycle("gameTestList: ${names.size()} GameTest classes")
    }
}
tasks.named('processDevResources').configure { dependsOn 'gameTestList' }
configurations {
    devImplementation.extendsFrom implementation
    devCompileOnly.extendsFrom compileOnly
    devRuntimeOnly.extendsFrom runtimeOnly
}

// M42: the optional integration suite. gradlew integrationTests (or any run task with -Pintegration) switches on every dev
// group of mods we integrate (power, aquatic, biomes, storage, create, quests, kubejs, facades, maps for the client) plus
// run/integration-mods (the pipe and capture mods that have no group of their own: Integrated Dynamics + Tunnels, XNet,
// LaserIO, Modular Routers, Industrial Foregoing and their libraries, of ATM10AA). The GameTest server then runs in a
// directory of its own (run/gametest-integration) and also registers the integration-only GameTests of
// gametest/integration (system property bettacraft.integration); the normal suite never contains them.
// M59: every jar of the groups is downloaded from its official source by the manifest dev-mods.json (gradle/dev-mods.gradle),
// locally and in CI alike; the partial CI run (-PintegrationPartial, tools/ci) is gone.
def integration = project.hasProperty('integration') || gradle.startParameter.taskNames.any { it.toLowerCase().endsWith('integrationtests') }
// M42 part b: the zoo, the other half of the optional suite. gradlew zooTests (or any run task with -Pzoo) puts run/zoo-mods
// (mods of the ATM10 pack with animals and water plants that we do NOT integrate: Aether, Ars Nouveau + Elemental, Productive
// Bees, Occultism, Thaumaturge, EvilCraft, Actually Additions, Mahou Tsukai, Psychadelic Chemistry, Fungi Delight, Oritech
// Things, Garnished and their libraries, of ATM10AA) on the run together with the groups aquatic, biomes and create (their
// animals without a profile count too). The GameTest server runs in run/gametest-zoo and registers the zoo tests of
// gametest/zoo (system property bettacraft.zoo), which record how those animals and plants behave in our tanks.
def zoo = project.hasProperty('zoo') || gradle.startParameter.taskNames.any { it.toLowerCase().endsWith('zootests') }
def zooGroups = ['aquatic', 'biomes', 'create']
def withGroup = { String name -> project.hasProperty(name) || integration || (zoo && name in zooGroups) }
// a group whose mods the run requires (biomes, aquatic: some tests then insist on them)
def requireGroup = { String name -> project.hasProperty(name) || integration || (zoo && name in zooGroups) }
// M52b/M52c: every run of this branch (Minecraft 26.1.2) has its game directories under runRoot (default run/26.1.2, -PrunDir=...),
// never in run/ itself: the worlds, configs and mods folders there are the 1.21.1 ones of master. The folders of the optional
// mod groups are under runRoot too (run/26.1.2/shader-mods ...: jars for Minecraft 26.1.2; run/power-mods ... hold 1.21.1 ones).
def runRoot = (project.findProperty('runDir') ?: "run/${minecraft_version}").toString()
def gameTestDir = runRoot + (integration ? '/gametest-integration' : zoo ? '/gametest-zoo' : '/gametest')

// Minecraft 26.1 ships Java 25. The foojay resolver (settings.gradle) downloads it if missing.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    // M52b: no Parchment for 1.21.11 (plain Mojang names)

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // client smoke tests and gradlew runClient -Pbackground : the window opens without focus (does not take the
            // keyboard or capture the mouse) and on a secondary monitor if there is one (BackgroundWindowMixin)
            if (project.hasProperty('background') || project.properties.keySet().any { it.startsWith('smoketest') || it == 'showcasetour' || it == 'showcasebench' }) {
                systemProperty 'bettacraft.background', 'true'
            }
            // M52d: the dev runtime validates every draw (26.2); Iris 1.11.4's shadow pipelines trip a bounds bug of that validation
            // (index past the pipeline's vertex bindings), production has no validation: off for shader runs
            if (project.hasProperty('shaders')) systemProperty 'neoforge.disableGlValidation', 'true'
            // M52: -Pvulkan starts the client on the Vulkan backend of 26.2 (launch argument, overrides the video setting)
            if (project.hasProperty('vulkan')) programArguments.addAll '--graphicsBackend', 'vulkan'
            // M54: every dev client is silent (BackgroundSoundMixin; the saved options stay as they are); -Psound to hear it
            if (!project.hasProperty('sound')) systemProperty 'bettacraft.silent', 'true'
            // gradlew runClient -Psmoketest : quits automatically once the title screen is reached
            if (project.hasProperty('smoketest')) systemProperty 'bettacraft.smoketest', 'true'
            // gradlew runClient -Psmoketestworld : flat world with two tanks, screenshots to run/screenshots, then quits
            if (project.hasProperty('smoketestworld')) systemProperty 'bettacraft.smoketest.world', 'true'
            // gradlew runClient -Psmoketestm7 : the same world, but only the M7 scene (aquarium mods)
            if (project.hasProperty('smoketestm7')) {
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m7only', 'true'
            }
            // gradlew runClient -Psmoketestm9 : only the M9 scene (water quality, coolers, lid, breeders, water tab)
            if (project.hasProperty('smoketestm9')) {
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m9only', 'true'
            }
            // gradlew runClient -Psmoketestm10 : only the M10 scene (free tank shapes: L, T, step, miniature of an L)
            if (project.hasProperty('smoketestm10')) {
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m10only', 'true'
            }
