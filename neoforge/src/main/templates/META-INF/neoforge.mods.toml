modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/0verEngineer/BettaCraft/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/0verEngineer/BettaCraft"
# wide pixel-art banner (tools/assetgen/preview.py make_banner) in the mod list; the square icon bettacraft.png stays the
# mod / project icon. No blur when scaled.
logoFile="bettacraft_logo.png"
logoBlur=false
credits="Code, generated textures and models: 0verEngineer. Inspired by real betta keeping."
description='''${mod_description}'''

# Catalogue and similar mod lists: the square icon next to the name
[modproperties.${mod_id}]
    catalogueImageIcon="bettacraft.png"

[[mixins]]
config="${mod_id}.mixins.json"

# M52: the NeoForge-only mixins (model data of our block entities, the GuideME screens)
[[mixins]]
config="${mod_id}.neoforge.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jade"
    type="optional"
    versionRange="[15,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="theoneprobe"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="wthit"
    type="optional"
    versionRange="[12,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="guideme"
    type="optional"
    versionRange="[21.1.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19,)"
    ordering="NONE"
    side="BOTH"

# Aquarium mods (M7): two-way compatibility through ids, tags and NBT; nothing is required.
[[dependencies.${mod_id}]]
    modId="betterfishtanks"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="fintastic"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="fishofthieves"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="aquaculture"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="naturalist"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"
