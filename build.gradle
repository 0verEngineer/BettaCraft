plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Resources produced by the data generators (runData).
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('.cache')
}

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 ships Java 21. The foojay resolver (settings.gradle) downloads it if missing.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // gradlew runClient -Psmoketest : quits automatically once the title screen is reached
            if (project.hasProperty('smoketest')) systemProperty 'bettacraft.smoketest', 'true'
            // gradlew runClient -Psmoketestworld : flat world with two tanks, screenshots to run/screenshots, then quits
            if (project.hasProperty('smoketestworld')) systemProperty 'bettacraft.smoketest.world', 'true'
            // gradlew runClient -Psmoketestm7 : the same world, but only the M7 scene (aquarium mods)
            if (project.hasProperty('smoketestm7')) {
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m7only', 'true'
            }
            // gradlew runClient -Psmoketestm9 : only the M9 scene (water quality, coolers, lid, breeders, water tab)
            if (project.hasProperty('smoketestm9')) {
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m9only', 'true'
            }
            // gradlew runClient -Psmoketestm8 : only the M8 scene (Jade / The One Probe / WTHIT overlays)
            if (project.hasProperty('smoketestm8')) {
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m8only', 'true'
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // gradlew runServer -Psmoketest : builds a tank, measures the interior and stops the server
            if (project.hasProperty('smoketest')) systemProperty 'bettacraft.smoketest', 'true'
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    // Optional integrations (compileOnly; only loaded at runtime in dev)
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { name = 'BlameJared (JEI)'; url = 'https://maven.blamejared.com' } }
        filter { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' }
    }
    // Better Fish Tanks is only published on CurseForge
    exclusiveContent {
        forRepository { maven { name = 'CurseMaven'; url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
}

// Plain JUnit 5 tests. They run WITHOUT a Minecraft bootstrap; only classes that do not
// touch registries (e.g. CompoundTag, TagParser) may be used there.
neoForge.addModdingDependenciesTo(sourceSets.test)

dependencies {
    // Jade (optional dependency, PLAN 10). In dev it is on the run classpath unless -PnoJade is given; never for
    // GameTests (Jade pings the mock players of the GameTest framework, which cannot receive payloads).
    compileOnly "maven.modrinth:jade:${jade_version}"
    boolean gameTests = gradle.startParameter.taskNames.any { it.toLowerCase().contains('gametest') }
    if (!project.hasProperty('noJade') && !gameTests) localRuntime "maven.modrinth:jade:${jade_version}"
    // GuideME (optional, PLAN 9): the handbook. On the run classpath in dev (also for GameTests: the book tests need the
    // guide item) unless -PnoGuideme is given.
    compileOnly "maven.modrinth:guideme:${guideme_version}"
    if (!project.hasProperty('noGuideme')) localRuntime "maven.modrinth:guideme:${guideme_version}"
    // JEI (optional): information pages. Not for GameTests, not with -PnoJei.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (!project.hasProperty('noJei') && !gameTests) localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // The One Probe and WTHIT (M8, optional): same information as the Jade plugin. On the run classpath in dev unless
    // -PnoTop / -PnoWthit is given; never for GameTests (they ping the mock players like Jade).
    compileOnly "maven.modrinth:the-one-probe:${top_version}"
    if (!project.hasProperty('noTop') && !gameTests) localRuntime "maven.modrinth:the-one-probe:${top_version}"
    compileOnly "maven.modrinth:wthit:${wthit_version}"
    compileOnly "maven.modrinth:badpackets:${badpackets_version}"
    if (!project.hasProperty('noWthit') && !gameTests) {
        localRuntime "maven.modrinth:wthit:${wthit_version}"
        localRuntime "maven.modrinth:badpackets:${badpackets_version}"
    }

    // Aquarium mods (M7, all optional): no compile dependency at all, the compat code works with item/entity ids, NBT
    // and reflection. In dev they are on the run classpath (client, server and GameTests) unless -PnoCompat is given;
    // the versions are the ones of ATM10.
    if (!project.hasProperty('noCompat')) {
        localRuntime "curse.maven:better-fishtanks-1196541:${bft_file_id}"
        localRuntime "maven.modrinth:mint-lib:${mint_lib_version}"
        localRuntime "maven.modrinth:fintastic:${fintastic_version}"
        localRuntime "maven.modrinth:fish-of-thieves:${fish_of_thieves_version}"
        localRuntime "maven.modrinth:yacl:${yacl_version}"
        localRuntime "maven.modrinth:aquaculture:${aquaculture_version}"
        localRuntime "maven.modrinth:naturalist:${naturalist_version}"
    }

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Tests read lang files from the source tree (de_de completeness check).
    systemProperty 'bettacraft.projectDir', project.projectDir.absolutePath
    inputs.files(fileTree('src/main/resources/assets'), fileTree('src/generated/resources'))
        .withPropertyName('langSources')
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
