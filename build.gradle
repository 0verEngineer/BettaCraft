plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Resources produced by the data generators (runData).
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('.cache')
}

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 ships Java 21. The foojay resolver (settings.gradle) downloads it if missing.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // client smoke tests and gradlew runClient -Pbackground : the window opens without focus (does not take the
            // keyboard or capture the mouse) and on a secondary monitor if there is one (BackgroundWindowMixin)
            if (project.hasProperty('background') || project.properties.keySet().any { it.startsWith('smoketest') }) {
                systemProperty 'bettacraft.background', 'true'
            }
            // gradlew runClient -Psmoketest : quits automatically once the title screen is reached
            if (project.hasProperty('smoketest')) systemProperty 'bettacraft.smoketest', 'true'
            // gradlew runClient -Psmoketestworld : flat world with two tanks, screenshots to run/screenshots, then quits
            if (project.hasProperty('smoketestworld')) systemProperty 'bettacraft.smoketest.world', 'true'
            // gradlew runClient -Psmoketestm7 : the same world, but only the M7 scene (aquarium mods)
            if (project.hasProperty('smoketestm7')) {
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m7only', 'true'
            }
            // gradlew runClient -Psmoketestm9 : only the M9 scene (water quality, coolers, lid, breeders, water tab)
            if (project.hasProperty('smoketestm9')) {
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m9only', 'true'
            }
            // gradlew runClient -Psmoketestm10 : only the M10 scene (free tank shapes: L, T, step, miniature of an L)
            if (project.hasProperty('smoketestm10')) {
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m10only', 'true'
            }
            // gradlew runClient -Psmoketestm11 : only the M11 scene (tank styles, connected glass, thin edges, water seam, mirror stick)
            if (project.hasProperty('smoketestm11')) {
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m11only', 'true'
            }
            // gradlew runClient -Psmoketestm12 : only the M12 scene (floating plants)
            if (project.hasProperty('smoketestm12')) {
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m12only', 'true'
            }
            // gradlew runClient -Psmoketestm8 : only the M8 scene (Jade / The One Probe / WTHIT overlays)
            if (project.hasProperty('smoketestm8')) {
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m8only', 'true'
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // gradlew runServer -Psmoketest : builds a tank, measures the interior and stops the server
            if (project.hasProperty('smoketest')) systemProperty 'bettacraft.smoketest', 'true'
            // gradlew runServer -PsmoketestOldWorld : runs on a fresh copy of a world saved by an older version
            // (run/saves/<-PoldWorld, default "Bettacraft Testwelt M11"> -> run/oldworld_check), checks every tank, stops
            if (project.hasProperty('smoketestOldWorld')) {
                systemProperty 'bettacraft.smoketest.oldworld', 'true'
                programArguments.addAll '--world', 'oldworld_check'
            }
            // gradlew runServer -Psmoketestmp : the multiplayer test stage, waits for the clients Dev1 and Dev2 (normally
            // started together with the clients by gradlew runMultiplayerTest)
            if (project.hasProperty('smoketestmp')) systemProperty 'bettacraft.smoketest.mp', 'true'
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    // Optional integrations (compileOnly; only loaded at runtime in dev)
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { name = 'BlameJared (JEI)'; url = 'https://maven.blamejared.com' } }
        filter { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' }
    }
    // Better Fish Tanks is only published on CurseForge
    exclusiveContent {
        forRepository { maven { name = 'CurseMaven'; url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
}

// Plain JUnit 5 tests. They run WITHOUT a Minecraft bootstrap; only classes that do not
// touch registries (e.g. CompoundTag, TagParser) may be used there.
neoForge.addModdingDependenciesTo(sourceSets.test)

dependencies {
    // Jade (optional dependency, PLAN 10). In dev it is on the run classpath unless -PnoJade is given; never for
    // GameTests (Jade pings the mock players of the GameTest framework, which cannot receive payloads).
    compileOnly "maven.modrinth:jade:${jade_version}"
    boolean gameTests = gradle.startParameter.taskNames.any { it.toLowerCase().contains('gametest') }
    if (!project.hasProperty('noJade') && !gameTests) localRuntime "maven.modrinth:jade:${jade_version}"
    // GuideME (optional, PLAN 9): the handbook. On the run classpath in dev (also for GameTests: the book tests need the
    // guide item) unless -PnoGuideme is given.
    compileOnly "maven.modrinth:guideme:${guideme_version}"
    if (!project.hasProperty('noGuideme')) localRuntime "maven.modrinth:guideme:${guideme_version}"
    // JEI (optional): information pages. Not for GameTests, not with -PnoJei.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (!project.hasProperty('noJei') && !gameTests) localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // The One Probe and WTHIT (M8, optional): same information as the Jade plugin. On the run classpath in dev unless
    // -PnoTop / -PnoWthit is given; never for GameTests (they ping the mock players like Jade).
    compileOnly "maven.modrinth:the-one-probe:${top_version}"
    if (!project.hasProperty('noTop') && !gameTests) localRuntime "maven.modrinth:the-one-probe:${top_version}"
    compileOnly "maven.modrinth:wthit:${wthit_version}"
    compileOnly "maven.modrinth:badpackets:${badpackets_version}"
    if (!project.hasProperty('noWthit') && !gameTests) {
        localRuntime "maven.modrinth:wthit:${wthit_version}"
        localRuntime "maven.modrinth:badpackets:${badpackets_version}"
    }

    // Aquarium mods (M7, all optional): no compile dependency at all, the compat code works with item/entity ids, NBT
    // and reflection. In dev they are on the run classpath (client, server and GameTests) unless -PnoCompat is given;
    // the versions are the ones of ATM10.
    if (!project.hasProperty('noCompat')) {
        localRuntime "curse.maven:better-fishtanks-1196541:${bft_file_id}"
        localRuntime "maven.modrinth:mint-lib:${mint_lib_version}"
        localRuntime "maven.modrinth:fintastic:${fintastic_version}"
        localRuntime "maven.modrinth:fish-of-thieves:${fish_of_thieves_version}"
        localRuntime "maven.modrinth:yacl:${yacl_version}"
        localRuntime "maven.modrinth:aquaculture:${aquaculture_version}"
        localRuntime "maven.modrinth:naturalist:${naturalist_version}"
    }

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Tests read lang files from the source tree (de_de completeness check).
    systemProperty 'bettacraft.projectDir', project.projectDir.absolutePath
    inputs.files(fileTree('src/main/resources/assets'), fileTree('src/generated/resources'))
        .withPropertyName('langSources')
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Optional extra mods from local folders (not in git, e.g. copied from an ATM10 instance), synced into the mods folder
// of each run before it starts and removed again from runs without the flag:
//   -Pshaders : run/shader-mods (Sodium, Iris ...)                    for runClient
//   -Ppower   : run/power-mods  (EnderIO, Mekanism, Powah, Flux ...)  for runClient, runServer and runGameTestServer
def runModsDir = file('run/mods')
def gameTestModsDir = file('run/gametest/mods')
def extraMods = [
        [dir: file('run/shader-mods'), on: project.hasProperty('shaders'), tasks: ['runClient']],
        [dir: file('run/power-mods'), on: project.hasProperty('power'), tasks: ['runClient', 'runServer', 'runGameTestServer']],
]
// background client runs need the FML early loading window off (it would be created, focused, before any mod code)
def fmlToml = file('run/config/fml.toml')
def background = project.hasProperty('background') || project.properties.keySet().any { it.startsWith('smoketest') }
tasks.matching { it.name == 'runClient' }.configureEach { t ->
    t.doFirst {
        if (fmlToml.exists()) {
            def text = fmlToml.getText('UTF-8')
            def want = "earlyWindowControl = ${!background}"
            def updated = text.replaceAll(/earlyWindowControl = (true|false)/, want)
            if (updated != text) fmlToml.setText(updated, 'UTF-8')
        }
    }
}
tasks.matching { it.name in ['runClient', 'runServer', 'runData', 'runGameTestServer'] }.configureEach { t ->
    def target = t.name == 'runGameTestServer' ? gameTestModsDir : runModsDir
    def plan = extraMods.collect { g -> [jars: (g.dir.listFiles() ?: []).findAll { it.name.endsWith('.jar') }, add: g.on && t.name in g.tasks] }
    t.doFirst {
        target.mkdirs()
        plan.each { g ->
            g.jars.each { jar ->
                def dst = new File(target, jar.name)
                if (g.add) java.nio.file.Files.copy(jar.toPath(), dst.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                else if (dst.exists()) dst.delete()
            }
        }
    }
}

// -PsmoketestOldWorld: a fresh copy of the old world for every run (the original in run/saves stays untouched)
def oldWorldName = project.findProperty('oldWorld') ?: 'Bettacraft Testwelt M11'
tasks.matching { it.name == 'runServer' }.configureEach { t ->
    if (project.hasProperty('smoketestOldWorld')) {
        def src = file("run/saves/${oldWorldName}")
        def dst = file('run/oldworld_check')
        t.doFirst {
            if (!src.isDirectory()) throw new GradleException("old world not found: ${src}")
            dst.deleteDir()
            java.nio.file.Files.walk(src.toPath()).forEach { from ->
                def rel = src.toPath().relativize(from)
                def to = dst.toPath().resolve(rel)
                if (java.nio.file.Files.isDirectory(from)) java.nio.file.Files.createDirectories(to)
                else if (from.fileName.toString() != 'session.lock') java.nio.file.Files.copy(from, to)
            }
        }
    }
}

// gradlew runMultiplayerTest : multiplayer smoke test. Starts the dedicated server (run/, dev world, with the stage of
// DevSmokeMP) and, once it is up, two clients in the background (unfocused, second monitor) as Dev1 and Dev2 with game
// directories of their own (run/client1, run/client2: options and configs copied from run/, sound off, 30 fps) that join
// it and follow the script (DevClientSmokeMP). The game processes are started directly from the java command lines of
// runServer / runClient (no second Gradle build that would wait for the first one's locks). Logs: build/mptest/*.log,
// screenshots: run/client1|2/screenshots/mp_*.png. Fails unless the server logs "MP PASSED" and both clients finish.
tasks.register('runMultiplayerTest') {
    group = 'verification'
    description = 'Dedicated server + two background clients (Dev1, Dev2): multiplayer smoke test (plants, net, menu, sync)'
    notCompatibleWithConfigurationCache('starts the game processes of runServer and runClient')
    dependsOn 'prepareServerRun', 'prepareClientRun'
    dependsOn { [tasks.named('runServer').get().classpathProvider, tasks.named('runClient').get().classpathProvider] }
    doLast {
        def srv = tasks.named('runServer').get()
        def cli = tasks.named('runClient').get()
        def java = srv.javaLauncher.get().executablePath.asFile.absolutePath
        def logs = file('build/mptest')
        logs.deleteDir()
        logs.mkdirs()
        def runDir = file('run')
        // the extra mods of -Pshaders / -Ppower are not part of this test
        ['run/shader-mods', 'run/power-mods'].each { d ->
            (file(d).listFiles() ?: []).findAll { it.name.endsWith('.jar') }.each { j -> new File(runDir, "mods/${j.name}").delete() }
        }
        def props = new Properties()
        def sp = new File(runDir, 'server.properties')
        if (sp.exists()) sp.withInputStream { props.load(it) }
        if (props.getProperty('online-mode', 'true') != 'false') throw new GradleException('run/server.properties needs online-mode=false (dev clients have no account)')
        def port = props.getProperty('server-port', '25565')
        def cmd = { t, String name, List extraJvm, List extraArgs ->
            // the class path goes into an argument file (the Windows command line is limited to 32k characters)
            def cp = new File(logs, "${name}.classpath.txt")
            cp.write('-cp\n' + t.classpathProvider.files.collect { it.absolutePath.replace('\\', '/') }.join(File.pathSeparator) + '\n', 'UTF-8')
            ([java] + t.allJvmArgs + extraJvm + ["@${cp.absolutePath}", t.mainClass.get()] + t.args + extraArgs).collect { it.toString() }
        }
        def start = { String name, List command, File dir ->
            dir.mkdirs()
            def p = new ProcessBuilder(command).directory(dir).redirectErrorStream(true).redirectOutput(new File(logs, "${name}.log")).start()
            logger.lifecycle("started ${name} (pid ${p.pid()}) in ${dir}")
            p
        }
        def clientDir = { int n ->
            def dir = new File(runDir, "client${n}")
            dir.mkdirs()
            def cfgFrom = new File(runDir, 'config').toPath()
            if (java.nio.file.Files.isDirectory(cfgFrom)) {
                java.nio.file.Files.walk(cfgFrom).forEach { from ->
                    def to = new File(dir, 'config').toPath().resolve(cfgFrom.relativize(from).toString())
                    if (java.nio.file.Files.isDirectory(from)) java.nio.file.Files.createDirectories(to)
                    else if (!from.fileName.toString().endsWith('.bak')) java.nio.file.Files.copy(from, to, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }
            // background client: no FML early window (it would take the focus before any mod code runs)
            def fml = new File(dir, 'config/fml.toml')
            if (fml.exists()) fml.setText(fml.getText('UTF-8').replaceAll(/earlyWindowControl = (true|false)/, 'earlyWindowControl = false'), 'UTF-8')
            def set = [lang: 'en_us', maxFps: '30', renderDistance: '6', simulationDistance: '5', soundCategory_master: '0.0',
                       pauseOnLostFocus: 'false', onboardAccessibility: 'false', guiScale: '3', skipMultiplayerWarning: 'true',
                       joinedFirstServer: 'true', tutorialStep: 'none', fullscreen: 'false', narrator: '0']
            def src = new File(runDir, 'options.txt')
            def lines = src.exists() ? src.readLines('UTF-8') : []
            def out = lines.findAll { l -> !set.keySet().any { l.startsWith(it + ':') } } + set.collect { k, v -> "${k}:${v}".toString() }
            new File(dir, 'options.txt').write(out.join('\n') + '\n', 'UTF-8')
            dir
        }
        def procs = []
        def deadline = System.currentTimeMillis() + 12 * 60 * 1000L
        try {
            def server = start('server', cmd(srv, 'server', ['-Dbettacraft.smoketest.mp=true'], []), runDir)
            procs << server
            def serverLog = new File(logs, 'server.log')
            while (!(serverLog.exists() && serverLog.getText('UTF-8').contains('Done ('))) {
                if (!server.isAlive()) throw new GradleException("the server stopped while starting, see ${serverLog}")
                if (System.currentTimeMillis() > deadline - 9 * 60 * 1000L) throw new GradleException('the server did not start in 3 minutes')
                Thread.sleep(1000)
            }
            logger.lifecycle("server is up on port ${port}")
            [1, 2].each { n ->
                procs << start("client${n}", cmd(cli, "client${n}", ['-Dbettacraft.smoketest.mp=true', '-Dbettacraft.background=true',
                        "-Dbettacraft.smoketest.mp.address=localhost:${port}".toString()], ['--username', "Dev${n}".toString()]), clientDir(n))
                Thread.sleep(5000) // do not start both at the same moment (CPU, the second monitor)
            }
            while (procs.any { it.isAlive() } && System.currentTimeMillis() < deadline) Thread.sleep(1000)
            if (procs.any { it.isAlive() }) logger.error('runMultiplayerTest: timed out, stopping the game processes')
        } finally {
            procs.each { if (it.isAlive()) it.destroyForcibly() }
        }
        def text = { String n -> def f = new File(logs, "${n}.log"); f.exists() ? f.getText('UTF-8') : '' }
        def problems = []
        if (!text('server').contains('[smoketest] MP PASSED')) problems << 'server: no "[smoketest] MP PASSED" (see the "MP check failed" lines)'
        ['client1', 'client2'].each { c -> if (!text(c).contains('client finished')) problems << "${c}: did not finish the script".toString() }
        ['server', 'client1', 'client2'].each { n ->
            def lines = text(n).readLines()
            def errors = lines.findIndexValues { (it.contains('/ERROR]') && !it.contains('Missing translations')) || it =~ /^\S*(Exception|Error)\b/ }
            def ours = lines.findAll { it.contains('org.overengineer') && (it.trim().startsWith('at ') || it.contains('Exception')) }
            logger.lifecycle("${n}: ${errors.size()} error line(s), ${ours.size()} line(s) of a Bettacraft stack trace")
            lines.findAll { it.contains('[smoketest] MP') && (it.contains('failed') || it.contains('FAILED') || it.contains('PASSED')) }.each { logger.lifecycle("  ${it}") }
            if (!ours.isEmpty()) problems << "${n}: Bettacraft exception, e.g. ${ours.first().trim()}".toString()
        }
        [1, 2].each { n -> (new File(runDir, "client${n}/screenshots").listFiles() ?: []).findAll { it.name.startsWith('mp_') }.sort { it.name }.each { logger.lifecycle("screenshot ${it}") } }
        if (!problems.isEmpty()) throw new GradleException('runMultiplayerTest failed:\n  ' + problems.join('\n  ') + "\nlogs in ${logs}")
        logger.lifecycle("runMultiplayerTest PASSED (logs in ${logs})")
    }
}
