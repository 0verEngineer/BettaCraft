                systemProperty 'bettacraft.smoketest.m30conly', 'true'
            }
            if (project.hasProperty('smoketestm30b')) {
                // gradlew runClient -Psmoketestm30b : only the M30 part b scene (a 24 x 6 x 12 freshwater tank with the arapaima,
                // the redtail catfish, the wels and two motoro stingrays; a stingray from above and from the side)
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m30bonly', 'true'
            }
            if (project.hasProperty('smoketestm30a')) {
                // gradlew runClient -Psmoketestm30a : only the M30 part a scene (a 32 x 8 x 16 sea water tank with two dolphins,
                // a big freshwater tank with two pangasius, the player with a full transport tub)
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m30aonly', 'true'
            }
            if (project.hasProperty('smoketestm29d')) {
                // gradlew runClient -Psmoketestm29d : only the M29 part d scene (Florida crayfish in every colour and marbled
                // crayfish, a cool axolotl tank with the five colours and eggs on a plant, close-ups)
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m29only', 'true'
                systemProperty 'bettacraft.smoketest.m29d', 'true'
            }
            if (project.hasProperty('smoketestm29b')) {
                // gradlew runClient -Psmoketestm29b : only the M29 part b scene (every puffer, barb and loach variety and sex posed,
                // a close-up per species)
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m29only', 'true'
                systemProperty 'bettacraft.smoketest.m29b', 'true'
            }
            if (project.hasProperty('smoketestm281')) {
                // gradlew runClient -Psmoketestm281 : only the M28.1 part b scene (wild aquarium and floating plants in a river, a
                // swamp, a jungle and a cold pond, from above and under water; add -Pshaders for Complementary)
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m281only', 'true'
            }
            if (project.hasProperty('smoketestm28c')) {
                // gradlew runClient -Psmoketestm28c : only the M28 part c scene (wrecks, stones, roots, caves and tubes, ornaments with
                // the treasure chest bubbling from an air pump, leaf litter; add -Pshaders for Complementary)
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m28conly', 'true'
            }
            if (project.hasProperty('smoketestm28b')) {
                // gradlew runClient -Psmoketestm28b : only the M28 part b scene (carpets, mosses, Riccia, the rolling Marimo, the
                // tubers, the hammer and mushroom coral of shape version 1 and 3, water lettuce, hornwort, floating Riccia; add
                // -Pshaders for Complementary)
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m28bonly', 'true'
            }
            if (project.hasProperty('smoketestm28')) {
                // gradlew runClient -Psmoketestm28 : only the M28 part a scene (the new Anubias, Bucephalandras and stem plants inside
                // and outside, near and far; the white and pink Bucephalandras under the light bar and under a high-power LED;
                // add -Pshaders for Complementary)
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m28only', 'true'
            }
            // gradlew runClient -Psmoketestm22_1 : only the M22.1 scene (every plant and coral with its new shape inside and outside,
            // old/new, near/far, kelp and seagrass swaying outside, polyps closing, the confirm screen for emptying animals;
            // add -Pshaders for Complementary)
            if (project.hasProperty('smoketestm22_1')) {
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m22_1only', 'true'
            }
            // gradlew runClient -Psmoketestm8 : only the M8 scene (Jade / The One Probe / WTHIT overlays; add -Ptop / -Pwthit)
            if (project.hasProperty('smoketestm8')) {
                systemProperty 'bettacraft.smoketest.world', 'true'
                systemProperty 'bettacraft.smoketest.m8only', 'true'
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // gradlew runServer -Psmoketest : builds a tank, measures the interior and stops the server
            if (project.hasProperty('smoketest')) systemProperty 'bettacraft.smoketest', 'true'
            // gradlew runServer -PsmoketestOldWorld : runs on a fresh copy of a world saved by an older version
            // (run/saves/<-PoldWorld, default "Bettacraft Testwelt M11"> -> run/oldworld_check), checks every tank, stops
            if (project.hasProperty('smoketestOldWorld')) {
                systemProperty 'bettacraft.smoketest.oldworld', 'true'
                programArguments.addAll '--world', 'oldworld_check'
            }
            // gradlew runServer -Psmoketestmp : the multiplayer test stage, waits for the clients Dev1 and Dev2 (normally
            // started together with the clients by gradlew runMultiplayerTest)
            if (project.hasProperty('smoketestmp')) systemProperty 'bettacraft.smoketest.mp', 'true'
            // M25.1: -Pbiomes : a world of its own (run/world_biomes); the biome mods write their biome source into the
            // level.dat (Lithostitched), the normal dev world would no longer load without them
            if (project.hasProperty('biomes')) {
                systemProperty 'bettacraft.biomemods', 'true'
                programArguments.addAll '--world', 'world_biomes'
            }
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('biomes')) systemProperty 'bettacraft.biomemods', 'true' // M25.1
            if (project.hasProperty('aquatic')) systemProperty 'bettacraft.aquaticmods', 'true' // M38: the ForeignPlantGameTests then need Alex's Caves
        }

        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // the dev source set (and through it main) is on the class path of every run
            sourceSet = sourceSets.dev
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.dev)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    devRuntimeClasspath.extendsFrom localRuntime
}

repositories {
    // Optional integrations (compileOnly; only loaded at runtime in dev)
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { name = 'BlameJared (JEI)'; url = 'https://maven.blamejared.com' } }
        filter { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' }
    }
    // Better Fish Tanks is only published on CurseForge
    exclusiveContent {
        forRepository { maven { name = 'CurseMaven'; url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
}

// Plain JUnit 5 tests. They run WITHOUT a Minecraft bootstrap; only classes that do not
// touch registries (e.g. CompoundTag, TagParser) may be used there.
neoForge.addModdingDependenciesTo(sourceSets.test)
neoForge.addModdingDependenciesTo(sourceSets.dev)

dependencies {
    // Jade (optional dependency, PLAN 10). In dev it is on the run classpath unless -PnoJade is given; never for
    // GameTests (Jade pings the mock players of the GameTest framework, which cannot receive payloads).
    compileOnly "maven.modrinth:jade:${jade_version}"
    boolean gameTests = gradle.startParameter.taskNames.any { it.toLowerCase().contains('gametest') }
    if (!project.hasProperty('noJade') && !gameTests) localRuntime "maven.modrinth:jade:${jade_version}"
    // GuideME (optional, PLAN 9): the handbook. On the run classpath in dev (also for GameTests: the book tests need the
    // guide item) unless -PnoGuideme is given.
    compileOnly "maven.modrinth:guideme:${guideme_version}"
    if (!project.hasProperty('noGuideme')) localRuntime "maven.modrinth:guideme:${guideme_version}"
    // JEI (optional): information pages. Not for GameTests, not with -PnoJei.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (!project.hasProperty('noJei') && !gameTests) localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // The One Probe and WTHIT (M8, optional): same information as the Jade plugin. M21: no longer on the run classpath by
    // default (two overlay mods showed every tank twice); -Ptop / -Pwthit add them (-PnoTop / -PnoWthit still accepted, they
    // win). Never for GameTests (they ping the mock players like Jade). Config compat.overlayProvider picks the overlay.
    compileOnly "maven.modrinth:the-one-probe:${top_version}"
    if (project.hasProperty('top') && !project.hasProperty('noTop') && !gameTests) localRuntime "maven.modrinth:the-one-probe:${top_version}"
    // Create (M32 part c): only compileOnly for the one class that extends its abstract DisplaySource (Display Links),
    // loaded only when Create is there; everything else of the Create compat is reflection. Never in the jar; in dev
    // Create comes from run/create-mods (-Pcreate).
    compileOnly "maven.modrinth:create:${create_version}"
    // M41: the drive adapter's classes extend Create's kinetic block and block entity, whose super types live in the libraries
    // Create bundles (Ponder with Catnip, Flywheel, Registrate): compileOnly from the jars nested in the same Create jar
    // (extracted by extractCreateLibraries, read only). Never in our jar.
    compileOnly files({ fileTree(layout.buildDirectory.dir('create-libraries')).include('*.jar').files }) { builtBy 'extractCreateLibraries' }
    compileOnly "maven.modrinth:wthit:${wthit_version}"
    compileOnly "maven.modrinth:badpackets:${badpackets_version}"
    if (project.hasProperty('wthit') && !project.hasProperty('noWthit') && !gameTests) {
        localRuntime "maven.modrinth:wthit:${wthit_version}"
        localRuntime "maven.modrinth:badpackets:${badpackets_version}"
    }

    // Aquarium mods (M7, all optional): no compile dependency at all, the compat code works with item/entity ids, NBT
    // and reflection. In dev they are on the run classpath (client, server and GameTests) unless -PnoCompat is given;
    // the versions are the ones of ATM10.
    if (!project.hasProperty('noCompat')) {
        localRuntime "curse.maven:better-fishtanks-1196541:${bft_file_id}"
        localRuntime "maven.modrinth:mint-lib:${mint_lib_version}"
        localRuntime "maven.modrinth:fintastic:${fintastic_version}"
        localRuntime "maven.modrinth:fish-of-thieves:${fish_of_thieves_version}"
        localRuntime "maven.modrinth:yacl:${yacl_version}"
        localRuntime "maven.modrinth:aquaculture:${aquaculture_version}"
        localRuntime "maven.modrinth:naturalist:${naturalist_version}"
    }

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// M41: the libraries nested in the Create jar (jar-in-jar), for compiling the drive classes (compileOnly above)
configurations {
    createJar { transitive = false }
}
dependencies {
    createJar "maven.modrinth:create:${create_version}"
}
tasks.register('extractCreateLibraries', Copy) {
    def jar = configurations.createJar
    inputs.files(jar)
    from({ zipTree(jar.singleFile) }) {
        include 'META-INF/jarjar/*.jar'
        eachFile { it.path = it.name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('create-libraries')
}

test {
    useJUnitPlatform()
    // Tests read lang files from the source tree (de_de completeness check).
    systemProperty 'bettacraft.projectDir', project.projectDir.absolutePath
    inputs.files(fileTree('src/main/resources/assets'), fileTree('src/generated/resources'))
        .withPropertyName('langSources')
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

// M22.2: writes the generated parts of the handbook (profiles, "Obtaining", species tables, "Where to find what",
// advancements) from the game data; `gradlew test` (GuideGenTest) fails while the book and the data differ.
tasks.register('updateGuide', Test) {
    group = 'bettacraft'
    description = 'Writes the generated handbook sections from the game data (M22.2)'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'bettacraft.projectDir', project.projectDir.absolutePath
    systemProperty 'bettacraft.updateGuide', 'true'
    filter { includeTestsMatching 'org.overengineer.bettacraft.guide.GuideGenTest' }
    outputs.upToDateWhen { false }
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Optional extra mods from local folders (not in git, e.g. copied from an ATM10 instance), synced into the mods folder
// of each run before it starts and removed again from runs without the flag:
//   -Pshaders : run/shader-mods (Sodium, Iris ...)                    for runClient
//   -Ppower   : run/power-mods  (EnderIO, Mekanism, Powah, Flux ...)  for runClient, runServer and runGameTestServer
//   -Paquatic : run/aquatic-mods (M16: every mod of the ATM10 pack with water animals that is not already on the run
//               classpath as an aquarium mod, plus their libraries)  for runClient, runServer and runGameTestServer;
//               needs the aquarium mods (not with -PnoCompat: Critters and Companions uses their YACL)
//   -Pbiomes  : run/biome-mods (M25.1: Regions Unexplored + Lithostitched + TerraBlender from ATM10AA, Oh The Biomes
//               We've Gone + Oh The Trees You'll Grow + CorgiLib + GeckoLib from ATM10) for runClient, runServer and
//               runGameTestServer; the GameTest biomeModBiomesMapToTheirWaters and the server smoke then require them;
//               M38: Twilight Forest from ATM10AA too (its lily pads; ForeignPlantGameTests check the plants of both)
//   -Pstorage : run/storage-mods (M26 part b: Applied Energistics 2 and Refined Storage 2 from ATM10AA) for runClient,
//               runServer and runGameTestServer; the GameTests of StorageGameTests then move items with their buses
//   -Pcreate  : run/create-mods (M32 part b: Create 6 (Flywheel, Ponder and Registrate inside), Create Aeronautics (bundled:
//               Simulated, Aeronautics, Offroad) and Sable from ATM10AA) for runClient, runServer and runGameTestServer;
//               the GameTests of CreateGameTests then move tanks on pistons, bearings and Sable sub-levels
//   -Pquests  : run/quest-mods (M32 part d: FTB Quests, FTB Library, FTB Teams, Architectury from ATM10AA) for runClient,
//               runServer and runGameTestServer; the chapter of modpack/ is copied into the run's config/ftbquests, the
//               GameTest QuestGameTests then checks that FTB Quests loaded it
//   -Pmaps    : run/map-mods (M32 part d: JourneyMap from ATM10AA) for runClient: the alarm waypoints
//   -Pkubejs  : run/kubejs-mods (M32 part d: KubeJS and Rhino from ATM10AA) for runClient, runServer and runGameTestServer;
//               the example script of modpack/kubejs is copied into the run's kubejs/server_scripts (its lines go to
//               logs/kubejs/server.log)
//   -Pfacades : run/facade-mods (M40 part c: Cable Facades from ATM10AA) for runClient, runServer and runGameTestServer; the
//               GameTest cableFacadesOnAFilterPipe puts its facade on our filter pipes (its block tag is in our data). Mekanism
//               Covers (a Mekanism addon) lies in run/power-mods
//   -Pcompare : run/compare-mods (M36: DragN's Just Bettas + GeckoLib + TerraBlender from ATM10AA) for runClient and runServer:
//               only to compare the size of our bettas with theirs (the M36 client smoke puts one of theirs next to ours);
//               never in the jar, the repo or the README
def runModsDir = file('run/mods')
def gameTestModsDir = file('run/gametest/mods')
def extraMods = [
        [dir: file('run/shader-mods'), on: project.hasProperty('shaders'), tasks: ['runClient']],
        [dir: file('run/power-mods'), on: project.hasProperty('power'), tasks: ['runClient', 'runServer', 'runGameTestServer']],
        [dir: file('run/aquatic-mods'), on: project.hasProperty('aquatic'), tasks: ['runClient', 'runServer', 'runGameTestServer']],
        [dir: file('run/biome-mods'), on: project.hasProperty('biomes'), tasks: ['runClient', 'runServer', 'runGameTestServer']],
        [dir: file('run/storage-mods'), on: project.hasProperty('storage'), tasks: ['runClient', 'runServer', 'runGameTestServer']],
        [dir: file('run/create-mods'), on: project.hasProperty('create'), tasks: ['runClient', 'runServer', 'runGameTestServer']],
        [dir: file('run/quest-mods'), on: project.hasProperty('quests'), tasks: ['runClient', 'runServer', 'runGameTestServer']],
        [dir: file('run/map-mods'), on: project.hasProperty('maps'), tasks: ['runClient']],
        [dir: file('run/kubejs-mods'), on: project.hasProperty('kubejs'), tasks: ['runClient', 'runServer', 'runGameTestServer']],
        [dir: file('run/facade-mods'), on: project.hasProperty('facades'), tasks: ['runClient', 'runServer', 'runGameTestServer']],
        [dir: file('run/compare-mods'), on: project.hasProperty('compare'), tasks: ['runClient', 'runServer']],
]
// -Pquests / -Pkubejs: the FTB Quests chapter and the KubeJS example script of modpack/ into the run (replaced every run,
// removed without the flag)
tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer'] }.configureEach { t ->
    def base = t.name == 'runGameTestServer' ? 'run/gametest' : 'run'
    def copies = [
            [src: file('modpack/config/ftbquests/quests/chapters/bettacraft.snbt'), dst: file(base + '/config/ftbquests/quests/chapters/bettacraft.snbt'), on: project.hasProperty('quests')],
            [src: file('modpack/kubejs/server_scripts/bettacraft_events.js'), dst: file(base + '/kubejs/server_scripts/bettacraft_events.js'), on: project.hasProperty('kubejs')],
    ]
    t.doFirst {
        copies.each { c ->
            if (c.on) {
                c.dst.parentFile.mkdirs()
                java.nio.file.Files.copy(c.src.toPath(), c.dst.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } else if (c.dst.exists()) c.dst.delete()
        }
    }
}
// background client runs need the FML early loading window off (it would be created, focused, before any mod code)
def fmlToml = file('run/config/fml.toml')
def background = project.hasProperty('background') || project.properties.keySet().any { it.startsWith('smoketest') || it == 'showcasetour' || it == 'showcasebench' }
tasks.matching { it.name == 'runClient' }.configureEach { t ->
    t.doFirst {
        if (fmlToml.exists()) {
            def text = fmlToml.getText('UTF-8')
            def want = "earlyWindowControl = ${!background}"
            def updated = text.replaceAll(/earlyWindowControl = (true|false)/, want)
            if (updated != text) fmlToml.setText(updated, 'UTF-8')
        }
    }
}
tasks.matching { it.name in ['runClient', 'runServer', 'runData', 'runGameTestServer'] }.configureEach { t ->
    def target = t.name == 'runGameTestServer' ? gameTestModsDir : runModsDir
    def plan = extraMods.collect { g -> [jars: (g.dir.listFiles() ?: []).findAll { it.name.endsWith('.jar') }, add: g.on && t.name in g.tasks] }
    t.doFirst {
        target.mkdirs()
        // a library in two groups (TerraBlender, GeckoLib) stays when one of them is on
        def wanted = plan.findAll { it.add }.collectMany { g -> g.jars*.name } as Set
        plan.each { g ->
            g.jars.each { jar ->
                def dst = new File(target, jar.name)
                if (g.add) java.nio.file.Files.copy(jar.toPath(), dst.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                else if (dst.exists() && !(jar.name in wanted)) dst.delete()
            }
        }
    }
}

// -PsmoketestOldWorld: a fresh copy of the old world for every run (the original in run/saves stays untouched)
def oldWorldName = project.findProperty('oldWorld') ?: 'Bettacraft Testwelt M11'
tasks.matching { it.name == 'runServer' }.configureEach { t ->
    if (project.hasProperty('smoketestOldWorld')) {
        def src = file("run/saves/${oldWorldName}")
        def dst = file('run/oldworld_check')
        t.doFirst {
            if (!src.isDirectory()) throw new GradleException("old world not found: ${src}")
            dst.deleteDir()
            java.nio.file.Files.walk(src.toPath()).forEach { from ->
                def rel = src.toPath().relativize(from)
                def to = dst.toPath().resolve(rel)
                if (java.nio.file.Files.isDirectory(from)) java.nio.file.Files.createDirectories(to)
                else if (from.fileName.toString() != 'session.lock') java.nio.file.Files.copy(from, to)
            }
        }
    }
}

// gradlew runMultiplayerTest : multiplayer smoke test. Starts the dedicated server (run/, dev world, with the stage of
// DevSmokeMP) and, once it is up, two clients in the background (unfocused, second monitor) as Dev1 and Dev2 with game
// directories of their own (run/client1, run/client2: options and configs copied from run/, sound off, 30 fps) that join
// it and follow the script (DevClientSmokeMP). The game processes are started directly from the java command lines of
// runServer / runClient (no second Gradle build that would wait for the first one's locks). Logs: build/mptest/*.log,
// screenshots: run/client1|2/screenshots/mp_*.png. Fails unless the server logs "MP PASSED" and both clients finish.
tasks.register('runMultiplayerTest') {
    group = 'verification'
    description = 'Dedicated server + two background clients (Dev1, Dev2): multiplayer smoke test (plants, net, menu, sync)'
    notCompatibleWithConfigurationCache('starts the game processes of runServer and runClient')
    dependsOn 'prepareServerRun', 'prepareClientRun'
    dependsOn { [tasks.named('runServer').get().classpathProvider, tasks.named('runClient').get().classpathProvider] }
    doLast {
        def srv = tasks.named('runServer').get()
        def cli = tasks.named('runClient').get()
        def java = srv.javaLauncher.get().executablePath.asFile.absolutePath
        def logs = file('build/mptest')
        logs.deleteDir()
        logs.mkdirs()
        def runDir = file('run')
        // the extra mods of -Pshaders / -Ppower / -Paquatic / -Pbiomes / -Pstorage / -Pcreate are not part of this test
        ['run/shader-mods', 'run/power-mods', 'run/aquatic-mods', 'run/biome-mods', 'run/storage-mods', 'run/create-mods', 'run/quest-mods', 'run/map-mods', 'run/kubejs-mods', 'run/facade-mods', 'run/compare-mods'].each { d ->
            (file(d).listFiles() ?: []).findAll { it.name.endsWith('.jar') }.each { j -> new File(runDir, "mods/${j.name}").delete() }
        }
        def props = new Properties()
        def sp = new File(runDir, 'server.properties')
        if (sp.exists()) sp.withInputStream { props.load(it) }
        if (props.getProperty('online-mode', 'true') != 'false') throw new GradleException('run/server.properties needs online-mode=false (dev clients have no account)')
        def port = props.getProperty('server-port', '25565')
        def cmd = { t, String name, List extraJvm, List extraArgs ->
            // the class path goes into an argument file (the Windows command line is limited to 32k characters)
            def cp = new File(logs, "${name}.classpath.txt")
            cp.write('-cp\n' + t.classpathProvider.files.collect { it.absolutePath.replace('\\', '/') }.join(File.pathSeparator) + '\n', 'UTF-8')
            ([java] + t.allJvmArgs + extraJvm + ["@${cp.absolutePath}", t.mainClass.get()] + t.args + extraArgs).collect { it.toString() }
        }
        def start = { String name, List command, File dir ->
            dir.mkdirs()
            def p = new ProcessBuilder(command).directory(dir).redirectErrorStream(true).redirectOutput(new File(logs, "${name}.log")).start()
            logger.lifecycle("started ${name} (pid ${p.pid()}) in ${dir}")
            p
        }
        def clientDir = { int n ->
            def dir = new File(runDir, "client${n}")
            dir.mkdirs()
            def cfgFrom = new File(runDir, 'config').toPath()
            if (java.nio.file.Files.isDirectory(cfgFrom)) {
                java.nio.file.Files.walk(cfgFrom).forEach { from ->
                    def to = new File(dir, 'config').toPath().resolve(cfgFrom.relativize(from).toString())
                    if (java.nio.file.Files.isDirectory(from)) java.nio.file.Files.createDirectories(to)
                    else if (!from.fileName.toString().endsWith('.bak')) java.nio.file.Files.copy(from, to, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }
            // background client: no FML early window (it would take the focus before any mod code runs)
            def fml = new File(dir, 'config/fml.toml')
            if (fml.exists()) fml.setText(fml.getText('UTF-8').replaceAll(/earlyWindowControl = (true|false)/, 'earlyWindowControl = false'), 'UTF-8')
            def set = [lang: 'en_us', maxFps: '30', renderDistance: '6', simulationDistance: '5', soundCategory_master: '0.0',
                       pauseOnLostFocus: 'false', onboardAccessibility: 'false', guiScale: '3', skipMultiplayerWarning: 'true',
                       joinedFirstServer: 'true', tutorialStep: 'none', fullscreen: 'false', narrator: '0']
            def src = new File(runDir, 'options.txt')
            def lines = src.exists() ? src.readLines('UTF-8') : []
            def out = lines.findAll { l -> !set.keySet().any { l.startsWith(it + ':') } } + set.collect { k, v -> "${k}:${v}".toString() }
            new File(dir, 'options.txt').write(out.join('\n') + '\n', 'UTF-8')
            dir
        }
        def procs = []
        def deadline = System.currentTimeMillis() + 14 * 60 * 1000L
        try {
            def server = start('server', cmd(srv, 'server', ['-Dbettacraft.smoketest.mp=true'], []), runDir)
            procs << server
            def serverLog = new File(logs, 'server.log')
            while (!(serverLog.exists() && serverLog.getText('UTF-8').contains('Done ('))) {
                if (!server.isAlive()) throw new GradleException("the server stopped while starting, see ${serverLog}")
                if (System.currentTimeMillis() > deadline - 11 * 60 * 1000L) throw new GradleException('the server did not start in 3 minutes')
                Thread.sleep(1000)
            }
            logger.lifecycle("server is up on port ${port}")
            [1, 2].each { n ->
                procs << start("client${n}", cmd(cli, "client${n}", ['-Dbettacraft.smoketest.mp=true', '-Dbettacraft.background=true',
                        "-Dbettacraft.smoketest.mp.address=localhost:${port}".toString()], ['--username', "Dev${n}".toString()]), clientDir(n))
                Thread.sleep(5000) // do not start both at the same moment (CPU, the second monitor)
            }
            while (procs.any { it.isAlive() } && System.currentTimeMillis() < deadline) Thread.sleep(1000)
            if (procs.any { it.isAlive() }) logger.error('runMultiplayerTest: timed out, stopping the game processes')
        } finally {
            procs.each { if (it.isAlive()) it.destroyForcibly() }
        }
        def text = { String n -> def f = new File(logs, "${n}.log"); f.exists() ? f.getText('UTF-8') : '' }
        def problems = []
        if (!text('server').contains('[smoketest] MP PASSED')) problems << 'server: no "[smoketest] MP PASSED" (see the "MP check failed" lines)'
        ['client1', 'client2'].each { c -> if (!text(c).contains('client finished')) problems << "${c}: did not finish the script".toString() }
        ['server', 'client1', 'client2'].each { n ->
            def lines = text(n).readLines()
            def errors = lines.findIndexValues { (it.contains('/ERROR]') && !it.contains('Missing translations')) || it =~ /^\S*(Exception|Error)\b/ }
            def ours = lines.findAll { it.contains('org.overengineer') && (it.trim().startsWith('at ') || it.contains('Exception')) }
            logger.lifecycle("${n}: ${errors.size()} error line(s), ${ours.size()} line(s) of a Bettacraft stack trace")
            lines.findAll { it.contains('[smoketest] MP') && (it.contains('failed') || it.contains('FAILED') || it.contains('PASSED')) }.each { logger.lifecycle("  ${it}") }
            if (!ours.isEmpty()) problems << "${n}: Bettacraft exception, e.g. ${ours.first().trim()}".toString()
        }
        [1, 2].each { n -> (new File(runDir, "client${n}/screenshots").listFiles() ?: []).findAll { it.name.startsWith('mp_') }.sort { it.name }.each { logger.lifecycle("screenshot ${it}") } }
        if (!problems.isEmpty()) throw new GradleException('runMultiplayerTest failed:\n  ' + problems.join('\n  ') + "\nlogs in ${logs}")
        logger.lifecycle("runMultiplayerTest PASSED (logs in ${logs})")
    }
}

// gradlew buildShowcase : (re)builds the showcase world "Bettacraft Schaukasten" in run/saves from scratch (M21). A
// dedicated server without a window (game directory run/showcase with its own server.properties: flat world, creative,
// peaceful) creates the world, DevShowcase builds the rows of tanks, the world is saved and the server stops. Open it in
// the dev client (Singleplayer). Log: build/showcase/server.log. Not copied anywhere else.
tasks.register('buildShowcase') {
    group = 'bettacraft'
    description = 'Builds the showcase world "Bettacraft Schaukasten" (run/saves) with a dedicated server, no window'
    notCompatibleWithConfigurationCache('starts the game process of runServer')
    dependsOn 'prepareServerRun'
    dependsOn { tasks.named('runServer').get().classpathProvider }
    doLast {
        def srv = tasks.named('runServer').get()
        def java = srv.javaLauncher.get().executablePath.asFile.absolutePath
        def logs = file('build/showcase')
        logs.deleteDir()
        logs.mkdirs()
        def dir = file('run/showcase')
        dir.mkdirs()
        def saves = file('run/saves')
        saves.mkdirs()
        def world = new File(saves, 'Bettacraft Schaukasten')
        world.deleteDir()
        new File(dir, 'eula.txt').write('eula=true\n', 'UTF-8')
        new File(dir, 'server.properties').write([
                'online-mode=false', 'level-type=minecraft:flat', 'gamemode=creative', 'difficulty=peaceful', 'spawn-monsters=false',
                'spawn-animals=true', 'spawn-npcs=true', 'generate-structures=false', 'server-port=25599', 'spawn-protection=0',
                // spawn-animals must stay true: without it the server discards every water animal (our fish too); the gamerule
                // doMobSpawning is off instead
                'max-players=1', 'level-seed=21', 'allow-flight=true', 'enable-command-block=true',
                // M21.6: saving the big world can take longer than the watchdog's minute on a busy disk
                'max-tick-time=-1'].join('\n') + '\n', 'UTF-8')
        def cp = new File(logs, 'classpath.txt')
        cp.write('-cp\n' + srv.classpathProvider.files.collect { it.absolutePath.replace('\\', '/') }.join(File.pathSeparator) + '\n', 'UTF-8')
        def command = ([java] + srv.allJvmArgs + ['-Dbettacraft.showcase=true', "@${cp.absolutePath}".toString(), srv.mainClass.get()] + srv.args
                + ['--universe', saves.absolutePath, '--world', 'Bettacraft Schaukasten']).collect { it.toString() }
        def log = new File(logs, 'server.log')
        def p = new ProcessBuilder(command).directory(dir).redirectErrorStream(true).redirectOutput(log).start()
        logger.lifecycle("showcase server started (pid ${p.pid()}), log ${log}")
        if (!p.waitFor(15, java.util.concurrent.TimeUnit.MINUTES)) {
            p.destroyForcibly()
            throw new GradleException("buildShowcase: the server did not finish in 15 minutes, see ${log}")
        }
        def text = log.getText('UTF-8')
        text.readLines().findAll { it.contains('[showcase]') }.each { logger.lifecycle("  ${it}") }
        if (!text.contains('SHOWCASE BUILT')) throw new GradleException("buildShowcase failed, see ${log}")
        logger.lifecycle("showcase world: ${world}")
    }
}

// gradlew smoketestUpgrade : M21.5 upgrade test. Copies the reference world built by an older version (run/saves/
// <-PupgradeWorld, default "Bettacraft Referenz 1.13.1">, made by tools/upgrade/build_reference.sh with 1.13.1-beta.1,
// commit 909d12a) to run/upgrade/saves, runs a dedicated server without a window on it twice (stage 1: compare with the
// reference manifest the old version wrote, save, snapshot; stage 2: load the saved world again and compare with the
// snapshot) and fails on a difference or on an ERROR / exception line in the logs. Logs: build/upgrade/stage{1,2}.log.
tasks.register('smoketestUpgrade') {
    group = 'verification'
    description = 'Loads the reference world of an older version and checks that nothing is lost (dedicated server, no window)'
    notCompatibleWithConfigurationCache('starts the game process of runServer')
    dependsOn 'prepareServerRun'
    dependsOn { tasks.named('runServer').get().classpathProvider }
    doLast {
        def worldName = project.findProperty('upgradeWorld') ?: 'Bettacraft Referenz 1.13.1'
        def src = file("run/saves/${worldName}")
        if (!new File(src, 'bettacraft_reference.json').exists()) {
            throw new GradleException("reference world missing: ${src} (build it with: bash tools/upgrade/build_reference.sh)")
        }
        def srv = tasks.named('runServer').get()
        def java = srv.javaLauncher.get().executablePath.asFile.absolutePath
        def logs = file('build/upgrade')
        logs.deleteDir()
        logs.mkdirs()
        def dir = file('run/upgrade')
        def saves = new File(dir, 'saves')
        def world = new File(saves, 'upgrade_check')
        world.deleteDir()
        saves.mkdirs()
        java.nio.file.Files.walk(src.toPath()).forEach { from ->
            def to = world.toPath().resolve(src.toPath().relativize(from))
            if (java.nio.file.Files.isDirectory(from)) java.nio.file.Files.createDirectories(to)
            else if (from.fileName.toString() != 'session.lock') java.nio.file.Files.copy(from, to)
        }
        new File(dir, 'eula.txt').write('eula=true\n', 'UTF-8')
        new File(dir, 'server.properties').write(['online-mode=false', 'server-port=25598', 'spawn-protection=0', 'spawn-animals=true',
                'spawn-npcs=true', 'max-players=1'].join('\n') + '\n', 'UTF-8')
        def cp = new File(logs, 'classpath.txt')
        cp.write('-cp\n' + srv.classpathProvider.files.collect { it.absolutePath.replace('\\', '/') }.join(File.pathSeparator) + '\n', 'UTF-8')
        // vanilla noise of the dev runtime (translations of other mods' blocks) is not an error of the upgrade
        def allowed = [~/Missing translations/, ~/Mismatch in destroy block pos/, ~/Ambiguity between arguments/]
        for (stage in [1, 2]) {
            def command = ([java] + srv.allJvmArgs + ["-Dbettacraft.smoketest.upgrade=${stage}".toString(), "@${cp.absolutePath}".toString(), srv.mainClass.get()]
                    + srv.args + ['--universe', saves.absolutePath, '--world', 'upgrade_check']).collect { it.toString() }
            def log = new File(logs, "stage${stage}.log")
            def p = new ProcessBuilder(command).directory(dir).redirectErrorStream(true).redirectOutput(log).start()
            logger.lifecycle("upgrade stage ${stage}: server started (pid ${p.pid()}), log ${log}")
            if (!p.waitFor(15, java.util.concurrent.TimeUnit.MINUTES)) {
                p.destroyForcibly()
                throw new GradleException("smoketestUpgrade: stage ${stage} did not finish in 15 minutes, see ${log}")
            }
            def text = log.getText('UTF-8')
            text.readLines().findAll { it.contains('[smoketest] upgrade') || it.contains('UPGRADE STAGE') }.each { logger.lifecycle("  ${it}") }
            def errors = text.readLines().findAll { (it.contains('/ERROR]') || it ==~ /^(Caused by:|java\.|net\.minecraft|org\.overengineer).*/) && !allowed.any { a -> it =~ a } }
            errors.take(20).each { logger.lifecycle("  LOG: ${it}") }
            if (!text.contains("UPGRADE STAGE ${stage} PASSED")) throw new GradleException("smoketestUpgrade: stage ${stage} failed, see ${log}")
            if (!errors.isEmpty()) throw new GradleException("smoketestUpgrade: ${errors.size()} error line(s) in ${log}")
        }
        logger.lifecycle("UPGRADE TEST PASSED (${worldName})")
    }
}

// ---- M22: release checks (the same ones the release workflow runs) --------------------------------------------------

// MIT: the licence text goes into the jar
def licenseModId = mod_id
tasks.named('jar', Jar).configure {
    from('LICENSE') { rename { "LICENSE_${licenseModId}" } }
}

// gradlew verifyReleaseJar [-PexpectedVersion=1.2.3] : checks build/libs/bettacraft-<version>.jar before it is released:
//  - only allowed entries: our classes, assets/bettacraft, data/bettacraft, tags of other namespaces (c, minecraft, mods we
//    support), the NeoForge loot modifier list, mods.toml, mixin config, icon and logo, WTHIT plugin list, licence
//  - no development code: nothing of the dev source set (smoke tests, showcase, GameTests), no Dev*Smoke* / SmokeFreeze /
//    gametest classes, no GameTest templates, no source files of the asset tools (.bbmodel, .py ...), no file over 2 MB
//  - every mixin of bettacraft.mixins.json is in the jar
//  - the version in neoforge.mods.toml is mod_version (and -PexpectedVersion, e.g. the tag without "v", if given)
def verifyVersion = mod_version
def verifyModId = mod_id
def verifyExpected = providers.gradleProperty('expectedVersion')
def verifyDevClasses = sourceSets.dev.output.classesDirs
def verifyJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Checks the release jar: no dev/smoke/GameTest classes, no foreign assets, version matches'
    dependsOn 'jar', 'devClasses'
    inputs.file(verifyJar)
    inputs.files(verifyDevClasses)
    inputs.property('expectedVersion', verifyExpected.orElse(''))
    def report = layout.buildDirectory.file('verifyReleaseJar.txt')
    outputs.file(report)
    doLast {
        def jarFile = verifyJar.get().asFile
        def problems = []
        // classes of the dev source set, as jar paths
        def devNames = [] as Set
        verifyDevClasses.files.each { root ->
            if (root.isDirectory()) root.eachFileRecurse { f ->
                if (f.isFile() && f.name.endsWith('.class')) devNames << root.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            }
        }
        def allowed = [
                ~/^META-INF\/(MANIFEST\.MF|neoforge\.mods\.toml)$/,
                ~/^(bettacraft\.mixins\.json|bettacraft(_logo)?\.png|waila_plugins\.json|pack\.mcmeta|LICENSE_bettacraft)$/,
                ~/^org\/overengineer\/bettacraft\/.+\.class$/,
                ~/^assets\/bettacraft\/.+\.(json|png|mcmeta|md|nbt|ogg|txt)$/,
                ~/^data\/bettacraft\/.+\.(json|nbt|mcfunction)$/,
                ~/^data\/[a-z0-9_.-]+\/tags\/.+\.json$/,
                ~/^data\/neoforge\/loot_modifiers\/global_loot_modifiers\.json$/,
        ]
        def forbidden = [
                (~/(^|\/)Dev(Smoke|ClientSmoke|ClientShowcase|ClientHooks|Showcase|Upgrade)[^\/]*\.class$/): 'development class',
                (~/(^|\/)SmokeFreeze[^\/]*\.class$/)                                    : 'smoke test helper',
                (~/^org\/overengineer\/bettacraft\/gametest\//)                          : 'GameTest class',
                (~/GameTests?(\$[^\/]*)?\.class$/)                                       : 'GameTest class',
                (~/^data\/bettacraft\/structure\/empty_[^\/]*\.nbt$/)                     : 'GameTest template',
                (~/\.(bbmodel|py|pyc|blend|psd|xcf|kra|java|sh|bat|jar|zip)$/)          : 'source or archive file',
        ]
        def toml = null
        def mixinsJson = null
        def classes = [] as Set
        def count = 0
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { e ->
                if (e.directory) return
                count++
                def n = e.name
                if (n.endsWith('.class')) classes << n
                if (!allowed.any { n ==~ it }) problems << "not allowed in the jar: ${n}".toString()
                forbidden.each { re, what -> if (n =~ re) problems << "${what}: ${n}".toString() }
                if (devNames.contains(n)) problems << "class of the dev source set: ${n}".toString()
                if (e.size > 2L * 1024 * 1024) problems << "bigger than 2 MB: ${n} (${e.size} bytes)".toString()
                if (n == 'META-INF/neoforge.mods.toml') toml = zip.getInputStream(e).getText('UTF-8')
                if (n == "${verifyModId}.mixins.json".toString()) mixinsJson = zip.getInputStream(e).getText('UTF-8')
            }
        }
        if (toml == null) problems << 'META-INF/neoforge.mods.toml missing'
        else {
            def m = toml =~ /(?m)^version="([^"]*)"/
            def inJar = m.find() ? m.group(1) : null
            if (inJar != verifyVersion) problems << "neoforge.mods.toml has version ${inJar}, mod_version is ${verifyVersion}".toString()
            if (toml.contains('${')) problems << 'neoforge.mods.toml has an unexpanded placeholder'
        }
        def expected = verifyExpected.getOrElse('')
        if (!expected.isEmpty() && expected != verifyVersion) {
            problems << "expected version ${expected} (tag), but mod_version is ${verifyVersion}".toString()
        }
        if (jarFile.name != "${verifyModId}-${verifyVersion}.jar".toString()) problems << "unexpected jar name ${jarFile.name}".toString()
        if (mixinsJson == null) problems << "${verifyModId}.mixins.json missing".toString()
        else {
            def cfg = new groovy.json.JsonSlurper().parseText(mixinsJson)
            def pkg = cfg.package.replace('.', '/')
            ((cfg.mixins ?: []) + (cfg.client ?: []) + (cfg.server ?: [])).each { String mx ->
                if (!classes.contains("${pkg}/${mx.replace('.', '/')}.class".toString())) problems << "mixin ${mx} of the mixin config is not in the jar".toString()
            }
        }
        def out = report.get().asFile
        out.parentFile.mkdirs()
        out.write("${jarFile.name}: ${count} files, ${classes.size()} classes, ${problems.size()} problem(s)\n" + problems.collect { "  ${it}\n" }.join(''), 'UTF-8')
        if (!problems.isEmpty()) throw new GradleException("verifyReleaseJar: ${problems.size()} problem(s) in ${jarFile.name}:\n  " + problems.take(40).join('\n  '))
        logger.lifecycle("verifyReleaseJar: ${jarFile.name} OK (${count} files, ${classes.size()} classes, version ${verifyVersion})")
    }
}

// gradlew releaseNotes : the section of mod_version at the top of CHANGELOG.md ("## [<version>] - <date>" up to the next
// "## [" heading, without link references) -> build/release-notes.md, the body of the GitHub release and the changelog of
// the CurseForge upload. Fails if the first version section of CHANGELOG.md is not the one of mod_version.
def notesVersion = mod_version
def notesChangelog = file('CHANGELOG.md')
tasks.register('releaseNotes') {
    group = 'build'
    description = 'Extracts the CHANGELOG.md section of mod_version (must be the top one) into build/release-notes.md'
    inputs.file(notesChangelog)
    inputs.property('version', notesVersion)
    def out = layout.buildDirectory.file('release-notes.md')
    outputs.file(out)
    doLast {
        def lines = notesChangelog.readLines('UTF-8')
        def heads = lines.findIndexValues { it.startsWith('## [') }.collect { it as int }.findAll { !lines[it].toLowerCase().startsWith('## [unreleased]') }
        if (heads.isEmpty()) throw new GradleException('CHANGELOG.md has no "## [<version>]" section')
        int first = heads[0]
        if (!lines[first].startsWith("## [${notesVersion}]".toString())) {
            throw new GradleException("the top section of CHANGELOG.md is \"${lines[first]}\", expected \"## [${notesVersion}] - <date>\"")
        }
        def next = lines.findIndexOf(first + 1) { it.startsWith('## [') }
        int end = next < 0 ? lines.size() : next
        def body = new ArrayList(lines.subList(first + 1, end).findAll { !(it ==~ /^\[[^\]]+\]: .*/) })
        while (!body.isEmpty() && body.first().trim().isEmpty()) body.remove(0)
        while (!body.isEmpty() && body.last().trim().isEmpty()) body.remove(body.size() - 1)
        if (body.isEmpty()) throw new GradleException("the CHANGELOG.md section ${notesVersion} is empty")
        def f = out.get().asFile
        f.parentFile.mkdirs()
        f.write(body.join('\n') + '\n', 'UTF-8')
        logger.lifecycle("releaseNotes: ${body.size()} lines of ${notesVersion} -> ${f}")
    }
}

// gradlew modpackZip : the files for modpack makers in modpack/ (the FTB Quests chapter of tools/modpack/ftbquests_chapter.py,
// the KubeJS example script), in the folders of an instance (config/, kubejs/) -> build/distributions/bettacraft-modpack-
// <version>.zip, attached to the GitHub release. Not part of the mod jar.
tasks.register('modpackZip', Zip) {
    group = 'distribution'
    description = 'Zips modpack/ (FTB Quests chapter, KubeJS example script) for modpack makers'
    from('modpack')
    archiveFileName = "bettacraft-modpack-${mod_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
}

// gradlew curseforgeDescription [-PdescriptionRef=v1.2.3] : the CurseForge project description from docs/description.md.
// CurseForge has no API for the project description (only file uploads), so this makes a ready-to-paste version:
// build/curseforge/description.md (Markdown editor) and description.html (WYSIWYG editor, "Source" view). Relative image
// links (images/...) become raw.githubusercontent.com links pinned to descriptionRef (the release tag; default: the current
// commit), other relative links become github.com/.../blob/<ref>/ links, so images of old descriptions never break. Fails on
// a missing image, on a WebP image (use the GIF / PNG / JPG versions) and on a relative link left over.
// The images load only once the GitHub repository is public.
def descSource = file('docs/description.md')
def descRepo = 'https://github.com/0verEngineer/BettaCraft'
def descRaw = 'https://raw.githubusercontent.com/0verEngineer/BettaCraft'
def descRef = providers.gradleProperty('descriptionRef').orElse(
        providers.exec { commandLine 'git', 'rev-parse', 'HEAD'; ignoreExitValue = true }.standardOutput.asText.map { it.trim() ?: 'master' })
tasks.register('curseforgeDescription') {
    group = 'build'
    description = 'Builds the CurseForge project description (Markdown + HTML with absolute links) from docs/description.md'
    inputs.file(descSource)
    inputs.property('ref', descRef)
    def outDir = layout.buildDirectory.dir('curseforge')
    outputs.dir(outDir)
    doLast {
        String ref = descRef.get()
        File docs = descSource.parentFile
        def problems = []
        def abs = { String url, boolean image ->
            if (url ==~ /^(https?:|mailto:|#).*/) return url
            def target = docs.toPath().resolve(url).normalize()
            def rel = docs.parentFile.toPath().relativize(target).toString().replace('\\', '/')
            if (!target.toFile().exists()) problems << "missing file ${url}".toString()
            if (image && url.toLowerCase().endsWith('.webp')) problems << "WebP image ${url} (use the GIF / PNG / JPG)".toString()
            return image ? "${descRaw}/${ref}/${rel}".toString() : "${descRepo}/blob/${ref}/${rel}".toString()
        }
        String md = descSource.getText('UTF-8').replace('\r\n', '\n')
        // images first (also inside links), then links
        md = md.replaceAll(/!\[([^\]]*)\]\(([^)\s]+)\)/) { all, alt, url -> "![${alt}](${abs(url, true)})" }
        md = md.replaceAll(/(?<!!)\[([^\]]*)\]\(([^)\s]+)\)/) { all, text, url -> "[${text}](${abs(url, false)})" }
        md = md.replaceAll(/<img src="([^"]+)"/) { all, url -> "<img src=\"${abs(url, true)}\"" }
        if (!problems.isEmpty()) throw new GradleException("curseforgeDescription: ${problems.size()} problem(s) in docs/description.md:\n  " + problems.join('\n  '))

        // a small Markdown -> HTML converter for what description.md uses: headings, paragraphs, lists, tables, images,
        // links, bold, italic, code, quotes, rules and raw HTML lines
        def esc = { String s -> s.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;') }
        def inline = { String s ->
            def codes = []
            s = s.replaceAll(/`([^`]+)`/) { all, c -> codes << c; "\u0000${codes.size() - 1}\u0000" }
            s = esc(s)
            s = s.replaceAll(/!\[([^\]]*)\]\(([^)\s]+)\)/) { all, alt, url -> "<img src=\"${url}\" alt=\"${alt}\">" }
            s = s.replaceAll(/\[([^\]]*)\]\(([^)\s]+)\)/) { all, t, url -> "<a href=\"${url}\">${t}</a>" }
            s = s.replaceAll(/\*\*([^*]+)\*\*/, '<strong>$1</strong>')
            s = s.replaceAll(/(?<![\w*])\*([^*\s][^*]*)\*(?![\w*])/, '<em>$1</em>')
            s = s.replaceAll(/\u0000(\d+)\u0000/) { all, i -> "<code>${esc(codes[i as int])}</code>" }
            return s
        }
        def html = new StringBuilder()
        def lines = md.split('\n', -1) as List
        int i = 0
        while (i < lines.size()) {
            String l = lines[i]
            if (l.trim().isEmpty()) { i++; continue }
            def h = l =~ /^(#{1,6})\s+(.*)$/
            if (h.matches()) { int n = h.group(1).length(); html << "<h${n}>${inline(h.group(2))}</h${n}>\n"; i++; continue }
            if (l ==~ /^\s*(---|\*\*\*)\s*$/) { html << '<hr>\n'; i++; continue }
            if (l.startsWith('<')) { while (i < lines.size() && !lines[i].trim().isEmpty()) html << lines[i++] << '\n'; continue }
            if (l.startsWith('|')) {
                def rows = []
                while (i < lines.size() && lines[i].startsWith('|')) rows << lines[i++]
                html << '<table>\n'
                rows.eachWithIndex { String r, int k ->
                    if (k == 1 && r ==~ /^[|\s:-]+$/) return
                    def cells = r.replaceAll(/^\|/, '').replaceAll(/\|\s*$/, '').split(/\|/).collect { it.trim() }
                    String tag = k == 0 ? 'th' : 'td'
                    html << '<tr>' << cells.collect { "<${tag}>${inline(it)}</${tag}>" }.join('') << '</tr>\n'
                }
                html << '</table>\n'
                continue
            }
            if (l ==~ /^\s*([-*]|\d+\.)\s+.*/) {
                boolean ordered = l ==~ /^\s*\d+\.\s+.*/
                html << (ordered ? '<ol>\n' : '<ul>\n')
                while (i < lines.size() && lines[i] ==~ /^\s*([-*]|\d+\.)\s+.*/) {
                    String item = lines[i++].replaceFirst(/^\s*([-*]|\d+\.)\s+/, '')
                    while (i < lines.size() && lines[i] ==~ /^\s{2,}\S.*/ && !(lines[i] ==~ /^\s*([-*]|\d+\.)\s+.*/)) item += ' ' + lines[i++].trim()
                    html << '<li>' << inline(item) << '</li>\n'
                }
                html << (ordered ? '</ol>\n' : '</ul>\n')
                continue
            }
            if (l.startsWith('>')) {
                def q = []
                while (i < lines.size() && lines[i].startsWith('>')) q << lines[i++].replaceFirst(/^>\s?/, '')
                html << '<blockquote><p>' << inline(q.join(' ')) << '</p></blockquote>\n'
                continue
            }
            def para = []
            while (i < lines.size() && !lines[i].trim().isEmpty() && !(lines[i] ==~ /^(#{1,6}\s|\||>|<|\s*([-*]|\d+\.)\s).*/)) para << lines[i++].trim()
            html << '<p>' << inline(para.join(' ')) << '</p>\n'
        }
        def dir = outDir.get().asFile
        dir.mkdirs()
        new File(dir, 'description.md').write(md, 'UTF-8')
        new File(dir, 'description.html').write(html.toString(), 'UTF-8')
        int images = (md =~ /raw\.githubusercontent\.com/).size()
        logger.lifecycle("curseforgeDescription: ${images} image(s) pinned to ${ref} -> ${dir}/description.md and description.html " +
                '(paste by hand; the images load only from a public repository)')
    }
}

tasks.named('check').configure { dependsOn 'verifyReleaseJar' }
