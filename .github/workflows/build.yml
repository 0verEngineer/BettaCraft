# Build and tests.
#
# Lean on every push to master and on pull requests (private repository: Actions minutes are limited):
#   build (compile, unit tests, verifyReleaseJar), CHANGELOG top section, runData output unchanged, GameTests,
#   one dedicated-server smoke test (aquarium mods, Jade, JEI, GuideME on the server).
# Full when started by hand with "full" ticked (Actions > Build > Run workflow) and before every release (release.yml
# calls this workflow with full: true): additionally the server smoke without any optional mod, with The One Probe and
# WTHIT, and the GameTests with the power mods of -Ppower (M59: downloaded by Gradle from their official sources, pinned
# and hash-checked in dev-mods.json; only the download cache keeps them, never an artifact).
# Not here: client smoke tests (need a window / GPU), the multiplayer test, buildShowcase and smoketestUpgrade (slow: it builds
# its reference world from an old commit). The mod groups (integration, zoo, Fabric groups) run in the manual workflow
# integration.yml.
name: Build
# M65: the run says what it builds (the commit message otherwise), e.g. "Build master", "Build master (full, fabric)",
# "Build PR #12 (m65-pipes)"; a call from release.yml runs under the release's name
run-name: "Build ${{ github.event_name == 'pull_request' && format('PR #{0} ({1})', github.event.number, github.head_ref) || github.ref_name }}${{ inputs.full && (inputs.loader != '' && inputs.loader != 'both') && format(' (full, {0})', inputs.loader) || inputs.full && ' (full)' || (inputs.loader != '' && inputs.loader != 'both') && format(' ({0})', inputs.loader) || '' }}"

on:
  push:
    branches: [master, "26.2"]
    paths-ignore: ["README.md", "FEATURES.md", "LICENSE", ".gitignore", ".gitattributes", "docs/**"]
  pull_request:
    branches: [master, "26.2"]
    paths-ignore: ["README.md", "FEATURES.md", "LICENSE", ".gitignore", ".gitattributes", "docs/**"]
  workflow_dispatch:
    inputs:
      full:
        description: "Full test set (smoke without/with all optional mods, GameTests with the power mods)"
        type: boolean
        default: false
      loader:
        description: "Loader to test (the release of one loader tests only that one)"
        type: choice
        options: [both, neoforge, fabric]
        default: both
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true
      # M52: release.yml releases one loader per tag and runs only that loader's tests
      loader:
        type: string
        default: both

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when release.yml calls this workflow, so the release never cancels a build
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    # explicit bash: -e and -o pipefail (a failing gradlew in "... | tee" fails the step)
    shell: bash

env:
  # the run tasks are not configuration-cache compatible; no daemon on a throw-away runner
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_ARGS: --no-configuration-cache --stacktrace --console=plain

jobs:
  build:
    # the required status check of the branch ruleset (master, 1.21.11, 26.*): keep the name; both loaders
    name: Build, unit tests, GameTests, server smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # M52c: 26.1 runs on Java 25 (the Gradle daemon and the game)
          java-version: 25

      - name: Set up Gradle (cache, wrapper validation)
        uses: gradle/actions/setup-gradle@v6
        with:
          # the branches (one per Minecraft version) write the cache; pull requests and tags read it
          cache-read-only: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build, unit tests, release jar check, release notes
        run: |
          chmod +x gradlew
          # shellcheck disable=SC2086 # GRADLE_ARGS (and the task list) are split into words on purpose
          ./gradlew build releaseNotes $GRADLE_ARGS

      # M65: the CurseForge description follows the commit behind its ref (a tag set again must not stay UP-TO-DATE)
      - name: CurseForge description cache test
        run: bash tools/ci/test_curseforge_description.sh

      - name: Generated resources are up to date (runData)
        run: |
          # shellcheck disable=SC2086 # GRADLE_ARGS (and the task list) are split into words on purpose
          ./gradlew runData $GRADLE_ARGS
          if [ -n "$(git status --porcelain -- common/src/generated)" ]; then
            git status --porcelain -- common/src/generated | head -50
            echo "::error::common/src/generated differs from the runData output: run gradlew runData and commit the result"
            exit 1
          fi

      - name: GameTests
        if: inputs.loader != 'fabric'
        run: |
          # shellcheck disable=SC2086 # GRADLE_ARGS (and the task list) are split into words on purpose
          ./gradlew runGameTestServer $GRADLE_ARGS 2>&1 | tee gametest.log

      # the failed tests with their message as annotations on the run page (no need to search the log)
      - name: Failed GameTests
        if: failure() && inputs.loader != 'fabric' && hashFiles('gametest.log') != ''
        run: |
          grep -E "LogTestReporter\]: .* failed at " gametest.log | sed -E 's/^.*LogTestReporter\]: /::error title=GameTest failed::/' || true

      - name: Dedicated server smoke test (aquarium mods, Jade, JEI, GuideME)
        if: inputs.loader != 'fabric'
        run: |
          mkdir -p run/26.2
          echo "eula=true" > run/26.2/eula.txt
          # shellcheck disable=SC2086 # GRADLE_ARGS (and the task list) are split into words on purpose
          ./gradlew runServer -Psmoketest $GRADLE_ARGS 2>&1 | tee smoke-default.log
          grep -q "\[smoketest\] PASSED" smoke-default.log

      # M52: the Fabric half (fabric/: the same GameTests where they need nothing of NeoForge, a dedicated server smoke)
      - name: Fabric GameTests
        if: inputs.loader != 'neoforge'
        run: |
          # shellcheck disable=SC2086 # GRADLE_ARGS (and the task list) are split into words on purpose
          ./gradlew runFabricGameTest $GRADLE_ARGS 2>&1 | tee gametest-fabric.log

      - name: Failed Fabric GameTests
        if: failure() && inputs.loader != 'neoforge' && hashFiles('run/26.2/fabric/gametest/report.xml') != ''
        run: |
          python3 - <<'PY' || true
          import xml.etree.ElementTree as ET
          for tc in ET.parse('run/26.2/fabric/gametest/report.xml').iter('testcase'):
              f = tc.find('failure')
              if f is not None:
                  print('::error title=Fabric GameTest failed::' + tc.get('name') + ': ' + (f.get('message') or ''))
          PY

      - name: Fabric dedicated server smoke test
        if: inputs.loader != 'neoforge'
        run: |
          mkdir -p run/26.2/fabric/server
          echo "eula=true" > run/26.2/fabric/server/eula.txt
          # shellcheck disable=SC2086 # GRADLE_ARGS (and the task list) are split into words on purpose
          ./gradlew runFabricServer -Psmoketest $GRADLE_ARGS 2>&1 | tee smoke-fabric.log
          grep -q "\[smoketest\] PASSED" smoke-fabric.log

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: bettacraft-jar
          path: |
            build/libs/*.jar
            build/release-notes.md
          retention-days: 14
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-build
          path: |
            run/26.2/logs/
            run/26.2/gametest/logs/
            run/26.2/data/logs/
            gametest.log
            gametest-fabric.log
            run/26.2/fabric/server/logs/
            run/26.2/fabric/gametest/logs/
            run/26.2/fabric/gametest/report.xml
            smoke-*.log
            build/reports/
            common/build/reports/
            neoforge/build/reports/
            neoforge/build/verifyReleaseJar.txt
            fabric/build/verifyFabricJar.txt
          retention-days: 7
          if-no-files-found: ignore

  extended:
    name: ${{ matrix.name }}
    needs: build
    if: inputs.full == true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Server smoke without optional mods
            id: smoke-none
            loader: neoforge
            run: ./gradlew runServer -Psmoketest -PnoJade -PnoJei -PnoGuideme -PnoCompat
            check: smoke
          - name: Server smoke with The One Probe and WTHIT
            id: smoke-top-wthit
            loader: neoforge
            run: ./gradlew runServer -Psmoketest -Ptop -Pwthit
            check: smoke
          - name: Fabric production server smoke (intermediary, official jars)
            id: fabric-prod
            loader: fabric
            run: ./gradlew prodFabricServer -Psmoketest
            check: smoke
          - name: Fabric save and load (showcase world built, reloaded twice)
            id: fabric-saveload
            loader: fabric
            run: ./gradlew fabricSaveLoadTest
            check: exit
          - name: GameTests with the power mods (-Ppower)
            id: gametest-power
            loader: neoforge
            run: ./gradlew runGameTestServer -Ppower
            check: exit
    steps:
      - name: Checkout
        if: (inputs.loader != 'neoforge' && inputs.loader != 'fabric' || inputs.loader == matrix.loader)
        uses: actions/checkout@v7

      - name: Set up Java 25
        if: (inputs.loader != 'neoforge' && inputs.loader != 'fabric' || inputs.loader == matrix.loader)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # M52c: 26.1 runs on Java 25 (the Gradle daemon and the game)
          java-version: 25

      - name: Set up Gradle
        if: (inputs.loader != 'neoforge' && inputs.loader != 'fabric' || inputs.loader == matrix.loader)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: ${{ matrix.name }}
        if: (inputs.loader != 'neoforge' && inputs.loader != 'fabric' || inputs.loader == matrix.loader)
        run: |
          chmod +x gradlew
          mkdir -p run/26.2
          echo "eula=true" > run/26.2/eula.txt
          # shellcheck disable=SC2086 # GRADLE_ARGS (and the task list) are split into words on purpose
          ${{ matrix.run }} $GRADLE_ARGS 2>&1 | tee "${{ matrix.id }}.log"
          if [ "${{ matrix.check }}" = smoke ]; then grep -q "\[smoketest\] PASSED" "${{ matrix.id }}.log"; fi

      - name: Failed GameTests
        if: failure() && (inputs.loader != 'neoforge' && inputs.loader != 'fabric' || inputs.loader == matrix.loader) && matrix.check == 'exit' && hashFiles(format('{0}.log', matrix.id)) != ''
        run: |
          grep -E "LogTestReporter\]: .* failed at " "${{ matrix.id }}.log" | sed -E 's/^.*LogTestReporter\]: /::error title=GameTest failed::/' || true

      - name: Upload logs on failure
        if: (inputs.loader != 'neoforge' && inputs.loader != 'fabric' || inputs.loader == matrix.loader) && (failure())
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.id }}
          path: |
            run/26.2/logs/
            run/26.2/gametest/logs/
            ${{ matrix.id }}.log
            build/saveload-fabric/
          retention-days: 7
          if-no-files-found: ignore
