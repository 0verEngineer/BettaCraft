# Release of a pushed tag "v<mod_version>" (e.g. v1.14.0-beta.1):
#   1. the full test set of build.yml (build, unit tests, GameTests, all server smoke variants, -Ppower GameTests)
#   2. the jar is built again from the tag and checked (verifyReleaseJar -PexpectedVersion=<tag without v>: no dev /
#      smoke / GameTest classes, no foreign assets, mods.toml version = tag), the release notes are the top section of
#      CHANGELOG.md (releaseNotes; it must be the section of this version)
#   3. GitHub release with both jars (M52: NeoForge and Fabric) and their SHA-256 (prerelease for -alpha / -beta / -rc)
#   4. CurseForge file upload with mc-publish, only if the token secret AND the project id variable are set (channel
#      alpha / beta / release from the version). Without them the steps are skipped, nothing fails. CurseForge is the
#      only mod site. M52: two files in the same project, the NeoForge jar with the loader tag neoforge, the Fabric jar
#      with the loader tag fabric (each with its own dependencies).
#   5. the CurseForge project description from docs/description.md with absolute image links pinned to the tag
#      (curseforgeDescription), as a workflow artifact: CurseForge has no API for the description, paste it by hand.
# Started by hand (Actions > Release > Run workflow) it is a dry run: tests, jar check, release notes and the description,
# the jar as a workflow artifact, no GitHub release and no upload. Setup: the secret and variable below.
#
# Repository settings (Settings > Secrets and variables > Actions):
#   Secret:    CURSEFORGE_TOKEN        CurseForge API token (https://legacy.curseforge.com/account/api-tokens)
#   Variable:  CURSEFORGE_PROJECT_ID   numeric id of the CurseForge project
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Full test set
    uses: ./.github/workflows/build.yml
    with:
      full: true

  release:
    name: Release
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      GRADLE_ARGS: --no-configuration-cache --stacktrace --console=plain
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
      IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 25 for the Gradle daemon (Fabric Loom 1.19, gradle/gradle-daemon-jvm.properties), 21 for the game (default)
          java-version: |
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Version and channel
        id: version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-alpha*) type=alpha ;;
            *-beta*|*-rc*) type=beta ;;
            *-*) echo "::error::unknown pre-release suffix in $version (use -alpha.n, -beta.n or -rc.n)"; exit 1 ;;
            *) type=release ;;
          esac
          echo "type=$type" >> "$GITHUB_OUTPUT"
          if [ "$IS_TAG" = true ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match mod_version $version (expected v$version)"
              exit 1
            fi
            echo "expected=-PexpectedVersion=$version" >> "$GITHUB_OUTPUT"
          fi
          echo "Bettacraft $version, channel $type, tag: $IS_TAG"

      - name: Build, check the jar, release notes, CurseForge description
        env:
          # images of the description: pinned to the tag, in a dry run to the commit
          DESCRIPTION_REF: ${{ env.IS_TAG == 'true' && github.ref_name || github.sha }}
        run: |
          chmod +x gradlew
          # the tests ran in the checks job; here only the jar of the tag, its check and the notes
          ./gradlew assemble verifyReleaseJar verifyFabricJar releaseNotes curseforgeDescription modpackZip ${{ steps.version.outputs.expected }} -PdescriptionRef="$DESCRIPTION_REF" $GRADLE_ARGS
          cat neoforge/build/verifyReleaseJar.txt
          cat fabric/build/verifyFabricJar.txt
          for loader in neoforge fabric; do
            jar="build/libs/bettacraft-$loader-1.21.1-${{ steps.version.outputs.version }}.jar"
            test -f "$jar"
            (cd build/libs && sha256sum "$(basename "$jar")" > "$(basename "$jar").sha256")
          done
          cat build/libs/*.sha256
          echo "----- release notes -----"
          cat build/release-notes.md
          echo "----- CurseForge description (build/curseforge/) -----"
          ls -l build/curseforge

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: bettacraft-${{ steps.version.outputs.version }}
          path: |
            build/libs/bettacraft-neoforge-1.21.1-${{ steps.version.outputs.version }}.jar
            build/libs/bettacraft-neoforge-1.21.1-${{ steps.version.outputs.version }}.jar.sha256
            build/libs/bettacraft-fabric-1.21.1-${{ steps.version.outputs.version }}.jar
            build/libs/bettacraft-fabric-1.21.1-${{ steps.version.outputs.version }}.jar.sha256
            build/distributions/bettacraft-modpack-${{ steps.version.outputs.version }}.zip
            build/release-notes.md
          if-no-files-found: error

      - name: Upload the CurseForge description
        uses: actions/upload-artifact@v7
        with:
          name: curseforge-description-${{ steps.version.outputs.version }}
          path: build/curseforge/
          if-no-files-found: error

      - name: GitHub release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Bettacraft ${{ steps.version.outputs.version }}
          body_path: build/release-notes.md
          files: |
            build/libs/bettacraft-neoforge-1.21.1-${{ steps.version.outputs.version }}.jar
            build/libs/bettacraft-neoforge-1.21.1-${{ steps.version.outputs.version }}.jar.sha256
            build/libs/bettacraft-fabric-1.21.1-${{ steps.version.outputs.version }}.jar
            build/libs/bettacraft-fabric-1.21.1-${{ steps.version.outputs.version }}.jar.sha256
            build/distributions/bettacraft-modpack-${{ steps.version.outputs.version }}.zip
          prerelease: ${{ steps.version.outputs.type != 'release' }}
          make_latest: ${{ steps.version.outputs.type == 'release' }}
          fail_on_unmatched_files: true

      - name: Publish to CurseForge (NeoForge)
        if: env.IS_TAG == 'true' && env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_PROJECT_ID != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          # optional integrations (CurseForge slugs, all checked on their project pages in M43; a wrong slug fails the
          # upload): Jade, GuideME, JEI, The One Probe, WTHIT, Better Fishtanks, Fish of Thieves, Fintastic, Aquaculture 2,
          # Naturalist
          curseforge-dependencies: |
            jade(optional)
            guideme(optional)
            jei(optional)
            the-one-probe(optional)
            wthit-forge(optional)
            better-fishtanks(optional)
            fish-of-thieves(optional)
            fintastic(optional)
            aquaculture(optional)
            naturalist(optional)
          files: build/libs/bettacraft-neoforge-1.21.1-${{ steps.version.outputs.version }}.jar
          name: Bettacraft ${{ steps.version.outputs.version }} (NeoForge)
          version: ${{ steps.version.outputs.version }}
          version-type: ${{ steps.version.outputs.type }}
          changelog-file: build/release-notes.md
          loaders: neoforge
          game-versions: "1.21.1"
          java: "21"

      # M52: the Fabric jar, same project, loader tag fabric. Dependencies (CurseForge slugs, CHECK BEFORE THE FIRST
      # RELEASE: a wrong slug fails the upload): Fabric API and Forge Config API Port (required), Patchouli (the
      # handbook), Mod Menu (the config screen), Jade, WTHIT, The One Probe, JEI, REI and EMI (optional)
      - name: Publish to CurseForge (Fabric)
        if: env.IS_TAG == 'true' && env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_PROJECT_ID != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          curseforge-dependencies: |
            fabric-api(required)
            forge-config-api-port-fabric(required)
            patchouli-fabric(optional)
            modmenu(optional)
            jade(optional)
            wthit(optional)
            the-one-probe(optional)
            jei(optional)
            roughly-enough-items(optional)
            emi(optional)
          files: build/libs/bettacraft-fabric-1.21.1-${{ steps.version.outputs.version }}.jar
          name: Bettacraft ${{ steps.version.outputs.version }} (Fabric)
          version: ${{ steps.version.outputs.version }}+fabric
          version-type: ${{ steps.version.outputs.type }}
          changelog-file: build/release-notes.md
          loaders: fabric
          game-versions: "1.21.1"
          java: "21"
