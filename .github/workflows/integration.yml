# Optional mod suites (M42, M59), only by hand: Actions > Integration tests > Run workflow.
#
# M59: every foreign mod comes from the manifest dev-mods.json: Gradle downloads each jar from its official source (Modrinth
# Maven, CurseMaven, FTB Maven) and checks its SHA-1 and SHA-256. Nothing of them is committed, uploaded as an artifact or
# released: on failure only the logs are uploaded, and the Gradle cache is read-only here (the jars are never saved into it).
#   integration: gradlew integrationTests  - the whole GameTest suite plus the integration-only GameTests with every mod we
#                integrate (power, aquatic, biomes, storage, create, quests, kubejs, facades, pipes, integration-mods)
#   zoo:         gradlew zooTests          - the whole suite plus the zoo tests (mods we do not integrate) with aquatic,
#                biomes and create
#   fabric:      gradlew runFabricGameTest -Pfabricintegration -Pquests - the Fabric GameTests with the Fabric mod groups
name: Integration tests
# M65: the run names the suite and the branch, e.g. "Integration tests: zoo on master"
run-name: "Integration tests: ${{ inputs.suite }} on ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        type: choice
        options: [all, integration, zoo, fabric]
        default: all

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  GRADLE_ARGS: --no-configuration-cache --stacktrace --console=plain

jobs:
  suite:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Integration suite (every integrated mod)
            id: integration
            run: ./gradlew integrationTests
            logs: run/26.3/gametest-integration/logs/
          - name: Zoo suite (mods we do not integrate)
            id: zoo
            run: ./gradlew zooTests
            logs: run/26.3/gametest-zoo/logs/
          - name: Fabric GameTests with the Fabric mod groups
            id: fabric
            run: ./gradlew runFabricGameTest -Pfabricintegration -Pquests
            logs: run/26.3/fabric/gametest/logs/
    steps:
      - name: Checkout
        if: inputs.suite == 'all' || inputs.suite == matrix.id
        uses: actions/checkout@v7

      - name: Set up Java 21
        if: inputs.suite == 'all' || inputs.suite == matrix.id
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 25 for the Gradle daemon (Fabric Loom 1.19, gradle/gradle-daemon-jvm.properties), 21 for the game (default)
          java-version: |
            25
            21

      - name: Set up Gradle
        if: inputs.suite == 'all' || inputs.suite == matrix.id
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Free disk space (the mod jars and the GameTest worlds need a few GB)
        if: inputs.suite == 'all' || inputs.suite == matrix.id
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h .

      - name: ${{ matrix.name }}
        if: inputs.suite == 'all' || inputs.suite == matrix.id
        run: |
          chmod +x gradlew
          # shellcheck disable=SC2086 # GRADLE_ARGS (and the task list) are split into words on purpose
          ${{ matrix.run }} $GRADLE_ARGS 2>&1 | tee "${{ matrix.id }}.log"

      - name: Failed GameTests
        if: failure() && (inputs.suite == 'all' || inputs.suite == matrix.id) && hashFiles(format('{0}.log', matrix.id)) != ''
        run: |
          grep -E "LogTestReporter\]: .* failed at |FAILED|failed with" "${{ matrix.id }}.log" | sed -E 's/^.*LogTestReporter\]: /::error title=GameTest failed::/' | head -50 || true

      - name: Upload logs (never the mods)
        if: always() && (inputs.suite == 'all' || inputs.suite == matrix.id)
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.id }}
          path: |
            ${{ matrix.logs }}
            ${{ matrix.id }}.log
          retention-days: 7
          if-no-files-found: ignore
