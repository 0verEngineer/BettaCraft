def fabricServerFiles = { File dir ->
    dir.mkdirs()
    def eula = new File(dir, 'eula.txt')
    if (!eula.exists()) eula.text = 'eula=true\n'
    def sp = new File(dir, 'server.properties')
    def lines = sp.exists() ? sp.readLines('UTF-8') : ['online-mode=false']
    def port = lines.find { it.startsWith('server-port=') }?.substring(12)
