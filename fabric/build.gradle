// M52: the Fabric mod (Fabric Loom). Compiles the common sources (common/src/main) together with
// the Fabric platform layer and glue of this module (fabric/src/main) into one jar. M52c: Minecraft 26.1 is not obfuscated,
// Loom runs without remapping (plugin net.fabricmc.fabric-loom, no mappings, no intermediary). The handbook is
// a Modonomicon book converted from the GuideME pages at build time (tools/guide; M52b: Patchouli has no 1.21.11 build). Run tasks have names of their own
// (runFabricClient, runFabricServer, runFabricGameTest) so that the plain run tasks stay the NeoForge ones.
plugins {
    id 'net.fabricmc.fabric-loom'
    id 'java-library'
}

version = mod_version
group = mod_group_id

def commonProject = project(':common')

base {
    // bettacraft-fabric-26.1.2-<mod_version>.jar
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// M52: the plugins of the overlay and recipe viewer mods use only their (loader-independent) APIs: one source, both jars
def integrationSrc = layout.buildDirectory.dir('generated/integrations')
tasks.register('integrationSources', Sync) {
    from(rootProject.file('neoforge/src/main/java')) {
        include 'org/overengineer/bettacraft/compat/jade/**'
        include 'org/overengineer/bettacraft/compat/jei/**'
        include 'org/overengineer/bettacraft/compat/wthit/**'
        include 'org/overengineer/bettacraft/compat/top/**' // M52c: The One Probe for Fabric 26.1.2
    }
    into integrationSrc
}

sourceSets {
    main {
        java.srcDir(commonProject.file('src/main/java'))
        java.srcDir(integrationSrc)
        // M52b: no TOP and no EMI for Fabric 1.21.11; M52c: The One Probe is back for Fabric 26.1.2, EMI still has no build
        // (its "emi" entrypoint is left out of fabric.mod.json too: EMI would fail on the missing class)
        java.exclude('org/overengineer/bettacraft/fabric/compat/BettaCraftEmiPlugin.java')
        resources {
            srcDir(commonProject.file('src/main/resources'))
            srcDir(commonProject.file('src/generated/resources'))
            exclude('**/*.bbmodel')
            exclude('.cache')
        }
    }
    // the converter of the handbook (tools/guide), run by the build
    guideTool {
        java.srcDir(rootProject.file('tools/guide/src'))
    }
    // development only (GameTests, smoke scenes on Fabric), never in the jar
    // the dev source set: our Fabric dev code and every file of the NeoForge dev source set that needs nothing of NeoForge
    // (GameTests with their own annotations since M52b, smoke scenes, the showcase), see devExcluded
    dev {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        java {
            srcDir(rootProject.file('neoforge/src/dev/java'))
            exclude { FileTreeElement e -> !e.directory && devExcluded(e.file) }
        }
        resources {
            srcDir(layout.buildDirectory.dir('generated/devresources'))
            srcDir(rootProject.file('neoforge/src/dev/resources'))
        }
    }
}

// a NeoForge dev file is left out of the Fabric dev source set when it uses NeoForge or is listed here (it uses one of
// those files, or a mod that is not on Fabric)
def devExcludedNames = (project.findProperty('fabricDevExcludes') ?: '').toString().split(',').collect { it.trim() }.findAll { it }
ext.fabricDevSkip = [
    // need Create (no Create for Fabric 1.21.1 or 1.21.11)
    'CreateDriveGameTests', 'CreateTravelGameTests', 'CreateGameTests', 'CreateDeviceGameTests',
] as Set
ext.fabricDevClient = ['SmokeFreeze', 'DevHud', 'DevClientSmokeM11', 'DevClientSmokeM13'] as Set
def neoDev = rootProject.file('neoforge/src/dev/java').canonicalPath
ext.devExcluded = { File f ->
    if (!f.canonicalPath.startsWith(neoDev) || !f.name.endsWith('.java')) return false
    // the optional integration and zoo suites need mods of the NeoForge runs
    def rel = f.canonicalPath.substring(neoDev.length()).replace(File.separator, '/')
    if (rel.contains('/gametest/integration/') || rel.contains('/gametest/zoo/')) return true
    // of the client smoke scenes only those the Fabric client smoke runs (FabricClientSmoke), the rest needs JEI, GuideME ...
    if (rel.contains('/client/') && !fabricDevClient.contains(f.name - '.java')) return true
    if (devExcludedNames.contains(f.name - '.java') || fabricDevSkip.contains(f.name - '.java')) return true
    // Forge Config API Port brings NeoForge's config classes to Fabric (same names)
    return f.readLines('UTF-8').any { l -> l.contains('net.neoforged') && !l.contains('"net.neoforged')
            && !l.contains('net.neoforged.neoforge.common.ModConfigSpec') && !l.contains('net.neoforged.fml.config') }
}

// M52b/M52c: every Fabric run of this branch (Minecraft 26.1.2) has its game directories under fabricRunRoot (default
// run/26.1.2/fabric, -PfabricRunDir=...; the optional mod groups too); run-fabric/ holds the 1.21.1 runs of master,
// run/1.21.11/fabric the ones of the 1.21.11 branch
def fabricRunRoot = (project.findProperty('fabricRunDir') ?: "run/${minecraft_version}/fabric").toString()
ext.fabricRunRoot = fabricRunRoot

loom {
    accessWidenerPath = file('src/main/resources/bettacraft.accesswidener')
    runs {
        // runFabricClient [-Pbackground]: the background window like on NeoForge (BackgroundWindowMixin)
        fabricClient {
            client()
            runDir = "../${fabricRunRoot}"
            source sourceSets.dev
            ideConfigGenerated false
            if (project.hasProperty('background') || project.properties.keySet().any { it.startsWith('smoketest') }) {
                property 'bettacraft.background', 'true'
            }
            if (project.hasProperty('smoketest')) property 'bettacraft.smoketest', 'true'
            if (project.hasProperty('smoketestbook')) {
                property 'bettacraft.smoketest.world', 'true'
                property 'bettacraft.smoketest.fabric', 'true'
                property 'bettacraft.smoketest.book', 'true'
            }
            if (project.hasProperty('smoketestfabric')) {
                property 'bettacraft.smoketest.world', 'true'
                property 'bettacraft.smoketest.fabric', 'true'
            }
            programArgs '--width', '1280', '--height', '760'
            // M52: -Pvulkan starts the client on the Vulkan backend of 26.2 (launch argument, overrides the video setting)
            if (project.hasProperty('vulkan')) programArgs '--graphicsBackend', 'vulkan'
        }
        fabricServer {
            server()
            runDir = "../${fabricRunRoot}/server"
            source sourceSets.dev
            ideConfigGenerated false
            if (project.hasProperty('smoketest')) property 'bettacraft.smoketest', 'true'
            programArgs '--nogui'
        }
        // the Fabric GameTest server (fabric-gametest entry points of the dev source set); quits with the result
        fabricGameTest {
            server()
            runDir = "../${fabricRunRoot}/gametest"
            source sourceSets.dev
            ideConfigGenerated false
            property 'fabric-api.gametest', 'true'
            property 'fabric-api.gametest.report-file', "${rootProject.projectDir}/${fabricRunRoot}/gametest/report.xml"
            // M52b: only our tests (libraries of other mods may bring GameTests of their own)
            property 'fabric-api.gametest.filter', 'bettacraft:*'
            if (project.hasProperty('gametests')) property 'bettacraft.gametest.only', project.property('gametests')
        }
    }
}

configurations {
    devCompileClasspath.extendsFrom compileClasspath
    devRuntimeClasspath.extendsFrom runtimeClasspath
}

repositories {
    exclusiveContent {
        forRepository { maven { name = 'Fuzs'; url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' } }
        filter { includeGroup 'fuzs.forgeconfigapiport' }
    }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' } }
        filter { includeGroup 'com.terraformersmc' }
    }
    exclusiveContent {
        forRepository { maven { name = 'BlameJared (JEI)'; url = 'https://maven.blamejared.com' } }
        filter { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' }
    }
    exclusiveContent {
        forRepository { maven { name = 'shedaniel'; url = 'https://maven.shedaniel.me/' } }
        filter { includeGroup 'me.shedaniel.cloth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // M52c: Minecraft 26.1 is not obfuscated (no mappings)
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // NeoForge's config API on Fabric (the same TOML files and keys); the settings screen through Mod Menu
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    localRuntime "com.terraformersmc:modmenu:${modmenu_version}"
    // Team Reborn Energy: the power of the devices on Fabric (1 E = 1 FE), bundled (jar in jar) like other Fabric mods do
    implementation include("teamreborn:energy:${teamreborn_energy_version}") { transitive = false }
    // the handbook on Fabric (optional at runtime)
    compileOnly "maven.modrinth:modonomicon:${modonomicon_fabric_version}"
    if (!project.hasProperty('noPatchouli') && !project.hasProperty('noModonomicon')) {
        localRuntime "maven.modrinth:modonomicon:${modonomicon_fabric_version}"
        // its nested config library (Fiber; the dev runtime does not load the jars inside a mod jar): extracted, read only
        localRuntime files({ fileTree(layout.buildDirectory.dir('patchouli-libraries')).include('*.jar').files }) { builtBy 'extractPatchouliLibraries' }
    }

    // M52: the info overlays and the recipe viewer, the same plugin classes as on NeoForge (neoforge/compat/{jade,jei,wthit},
    // copied into the Fabric sources by integrationSources); -PfabricOverlays puts Jade and JEI into the dev runtime
    compileOnly "maven.modrinth:jade:${jade_fabric_version}"
    compileOnly "maven.modrinth:jei:${jei_fabric_version}"
    compileOnly("maven.modrinth:wthit:${wthit_fabric_version}") { transitive = false }
    // M52: REI (its plugin lives in fabric/compat). M52b: The One Probe and EMI have no Fabric 1.21.11 build (their plugins
    // are left out of this branch)
    compileOnly("maven.modrinth:rei:${rei_fabric_version}") { transitive = false }
    // M52c: The One Probe for Fabric 26.1.2 (its plugin lives in fabric/compat)
    compileOnly("maven.modrinth:the-one-probe:${top_fabric_version}") { transitive = false }
    compileOnly("maven.modrinth:architectury-api:${architectury_fabric_version}") { transitive = false }
    compileOnly 'me.shedaniel.cloth:basic-math:0.6.1'
    // nested in Cloth Config (the dev runtime does not load jars inside mod jars)
    if (project.hasProperty('rei')) localRuntime 'me.shedaniel.cloth:basic-math:0.6.1'

    // optional mod groups of the Fabric dev runs (official jars copied into <fabricRunRoot>/<group>, never committed):
    // -Poverlays (Jade, JEI, WTHIT, TOP), -Prei, -Pemi, -Pfabricintegration (Refined Storage, JourneyMap, Better Fish Tanks,
    // Naturalist, Fish of Thieves, Critters and Companions + libraries), -Pquests (FTB Quests, Library, Teams), M52b: -Pshaders
    // (Sodium, Iris; the shader pack in <fabricRunRoot>/shaderpacks)
    def groupJars = [:] // file name -> jar: a library in several groups (Architectury, Cloth Config) only once
    [overlays: 'overlay-mods', rei: 'rei-mods', emi: 'emi-mods', fabricintegration: 'integration-mods', quests: 'quest-mods', shaders: 'shader-mods'].each { flag, dir ->
        if (project.hasProperty(flag)) {
            rootProject.file("${fabricRunRoot}/${dir}").listFiles()?.findAll { it.name.endsWith('.jar') }?.each { groupJars.putIfAbsent(it.name, it) }
        }
    }
    if (!groupJars.isEmpty()) {
        localRuntime files(groupJars.values())
        // their jar-in-jar libraries (the dev runtime does not load nested jars), extracted read only; not the ones we or
        // the groups bring ourselves
        def nested = layout.buildDirectory.dir('nested-mods')
        def own = groupJars.keySet().collect { it.replaceAll(/[-_+]?\d.*$/, '') }
        def t = tasks.register('extractNestedMods', Sync) {
            groupJars.values().each { j ->
                from(zipTree(j)) {
                    include 'META-INF/jars/*.jar'
                    exclude '**/energy-*.jar'
                    // M52b: Night Config comes with Forge Config API Port (an older copy nested in another mod would win)
                    exclude '**/core-3.*.jar', '**/toml-3.*.jar'
                    eachFile { it.path = it.name }
                    includeEmptyDirs = false
                }
            }
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            eachFile { f -> if (own.any { o -> o && f.name.startsWith(o) }) f.exclude() }
            into nested
        }
        localRuntime files({ fileTree(nested).include('*.jar').files }) { builtBy t }
    }

    guideToolImplementation 'com.google.code.gson:gson:2.11.0'

    devCompileOnly 'org.jetbrains:annotations:24.1.0'
    // javax.annotation.Nullable of the common code (NeoForge brings it)
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

configurations {
    patchouliJar { transitive = false }
}
dependencies {
    patchouliJar "maven.modrinth:modonomicon:${modonomicon_fabric_version}"
}
tasks.register('extractPatchouliLibraries', Copy) {
    def jar = configurations.patchouliJar
    inputs.files(jar)
    from({ zipTree(jar.singleFile) }) {
        include 'META-INF/jars/*.jar'
        eachFile { it.path = it.name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('patchouli-libraries')
}

// ---- the handbook: the GuideME pages -> a Modonomicon book (build/generated/modonomicon: the book data, its textures and
// multiblocks, and our two language files with the book's texts added; first in the resources, so these lang files win)
def guideDir = commonProject.file('src/main/resources/assets/bettacraft/guides/bettacraft/guide')
def bookOut = layout.buildDirectory.dir('generated/modonomicon')
tasks.register('convertGuide', JavaExec) {
    group = 'bettacraft'
    description = 'Converts the GuideME handbook into the Modonomicon book of the Fabric jar (tools/guide)'
    classpath = sourceSets.guideTool.runtimeClasspath
    mainClass = 'org.overengineer.bettacraft.guidetool.ModonomiconConverter'
    inputs.dir(guideDir)
    inputs.files(commonProject.fileTree('src/generated/resources/data/bettacraft/recipe'), commonProject.fileTree('src/main/resources/data/bettacraft/recipe'))
    inputs.files(commonProject.file('src/generated/resources/assets/bettacraft/lang/en_us.json'), commonProject.file('src/main/resources/assets/bettacraft/lang/de_de.json'))
    outputs.dir(bookOut)
    def out = bookOut.get().asFile
    doFirst { out.deleteDir() }
    args guideDir.absolutePath,
            commonProject.file('src/generated/resources/assets/bettacraft/lang/en_us.json').absolutePath,
            commonProject.file('src/main/resources/assets/bettacraft/lang/de_de.json').absolutePath,
            out.absolutePath,
            commonProject.file('src/generated/resources/data/bettacraft/recipe').absolutePath,
            commonProject.file('src/main/resources/data/bettacraft/recipe').absolutePath
}
tasks.named('processResources').configure { dependsOn 'convertGuide' }

// ---- our data with NeoForge's conditions and ingredient types, converted for Fabric (build/generated/fabricdata, which wins
// over the common copies): neoforge:conditions -> fabric:load_conditions, neoforge:components / compound ingredients ->
// fabric:components / fabric:any. The NeoForge jar keeps the data as it is.
def fabricDataOut = layout.buildDirectory.dir('generated/fabricdata')
tasks.register('fabricData') {
    group = 'bettacraft'
    def roots = [commonProject.file('src/main/resources'), commonProject.file('src/generated/resources')]
    roots.each { inputs.dir(new File(it, 'data')) }
    outputs.dir(fabricDataOut)
    doLast {
        def out = fabricDataOut.get().asFile
        out.deleteDir()
        def slurper = new groovy.json.JsonSlurper()
        def conv
        conv = { Map c ->
            switch (c.type) {
                case 'neoforge:mod_loaded': return [condition: 'fabric:all_mods_loaded', values: [c.modid]]
                case 'neoforge:not': return [condition: 'fabric:not', value: conv(c.value as Map)]
                case 'neoforge:and': return [condition: 'fabric:and', values: c.values.collect { conv(it as Map) }]
                case 'neoforge:or': return [condition: 'fabric:or', values: c.values.collect { conv(it as Map) }]
                case 'neoforge:tag_empty': return [condition: 'fabric:not', value: [condition: 'fabric:tags_populated', registry: 'minecraft:item', values: [c.tag]]]
                case 'neoforge:true': return [condition: 'fabric:true']
                case 'neoforge:false': return [condition: 'fabric:not', value: [condition: 'fabric:true']]
                default:
                    def m = new LinkedHashMap(c)
                    m.remove('type')
                    return [condition: c.type] + m
            }
        }
        // M52b (1.21.2+ ingredients): an ingredient is an item id, a "#tag" or a list of item ids; NeoForge 21.11 marks its
        // own ingredient types with "neoforge:ingredient_type"
        def fix
        fix = { Object node ->
            if (node instanceof Map) {
                Map m = node as Map
                def itype = m['neoforge:ingredient_type'] ?: m.type
                if (itype == 'neoforge:components') {
                    return ['fabric:type': 'fabric:components', base: m.items, components: m.components]
                }
                if (itype == 'neoforge:compound') {
                    def kids = m.children.collect { fix(it) }
                    // only item ids (no tags, no custom ingredients): one plain list; otherwise Fabric's any-of ingredient
                    def plain = kids.every { k -> (k instanceof String && !k.startsWith('#')) || (k instanceof List && k.every { it instanceof String && !it.startsWith('#') }) }
                    return plain ? kids.collectMany { it instanceof List ? it : [it] } : ['fabric:type': 'fabric:any', ingredients: kids]
                }
                def r = new LinkedHashMap()
                m.each { k, v ->
                    if (k == 'neoforge:conditions') r['fabric:load_conditions'] = v.collect { conv(it as Map) }
                    else r[k] = fix(v)
                }
                return r
            }
            if (node instanceof List) return node.collect { fix(it) }
            return node
        }
        int n = 0
        roots.each { root ->
            def data = new File(root, 'data')
            if (!data.isDirectory()) return
            data.eachFileRecurse { f ->
                if (!f.name.endsWith('.json')) return
                def text = f.getText('UTF-8')
                if (!text.contains('"neoforge:conditions"') && !text.contains('"neoforge:components"') && !text.contains('"neoforge:compound"')
                        && !text.contains('"neoforge:ingredient_type"')) return
                def rel = root.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                def json = fix(slurper.parseText(text))
                def dst = new File(out, rel)
                dst.parentFile.mkdirs()
                dst.write(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), 'UTF-8')
                n++
            }
        }
        logger.lifecycle("fabricData: ${n} files converted")
    }
}
sourceSets.main.resources.srcDirs = [fabricDataOut, bookOut] + sourceSets.main.resources.srcDirs
tasks.named('processResources', ProcessResources).configure {
    dependsOn 'fabricData'
    // the converted copies come first and win
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ---- the GameTest classes of the Fabric dev source set (the shared BettaGameTests registers them, same list name as on NeoForge)
tasks.register('fabricGameTestList') {
    def out = layout.buildDirectory.file('generated/devresources/bettacraft_gametests.txt')
    def dirs = [rootProject.file('neoforge/src/dev/java'), file('src/dev/java')]
    dirs.each { inputs.dir(it) }
    inputs.property('skip', fabricDevSkip.toList().sort())
    outputs.file(out)
    doLast {
        def names = []
        dirs.each { d ->
            d.eachFileRecurse { f ->
                if (!f.name.endsWith('.java') || devExcluded(f)) return
                def text = f.getText('UTF-8')
                if (!(text =~ /(?m)^@GameTestHolder/)) return
                def pkg = (text =~ /(?m)^package ([\w.]+);/)[0][1]
                names << pkg + '.' + (f.name - '.java')
            }
        }
        names.sort()
        out.get().asFile.parentFile.mkdirs()
        out.get().asFile.text = names.join(System.lineSeparator()) + System.lineSeparator()
        logger.lifecycle("fabricGameTestList: ${names.size()} GameTest classes")
    }
}
tasks.named('processDevResources').configure { dependsOn 'fabricGameTestList' }

// (M52c: no render layer list any more: 26.1 takes the chunk layer of each quad from its texture, on both loaders)

def replaceProperties = [
        mod_id         : mod_id,
        mod_name       : mod_name,
        mod_version    : mod_version,
        mod_license    : mod_license,
        mod_authors    : mod_authors,
        mod_description: mod_description,
        minecraft_version: minecraft_version,
        fabric_loader_version: fabric_loader_version,
        fabric_minecraft_dependency: fabric_minecraft_dependency,
]
tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') { expand replaceProperties }
    // the GuideME pages are NeoForge's handbook; on Fabric the converted Modonomicon book replaces them
    exclude('assets/bettacraft/guides/**', 'assets/bettacraft/guideme_guides/**')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

tasks.named('compileJava') { dependsOn 'integrationSources' }
def licenseModId = mod_id
tasks.named('jar', Jar).configure {
    // the workflows pick the release jars up from the root build/libs
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    from(rootProject.file('LICENSE')) { rename { "LICENSE_${licenseModId}" } }
}

// the released Fabric jar: our classes only (no dev, smoke or GameTest code, no NeoForge stubs), the right version, the
// mixin configs, the converted data and the Modonomicon book, no foreign assets
tasks.register('verifyFabricJar') {
    group = 'verification'
    def jarTask = tasks.named('jar')
    dependsOn jarTask
    // only the file (the configuration cache cannot keep a task)
    def jarFile = jarTask.flatMap { it.archiveFile }
    def report = layout.buildDirectory.file('verifyFabricJar.txt')
    def expected = project.findProperty('expectedVersion')
    def version = project.mod_version
    def mcDependency = project.fabric_minecraft_dependency
    outputs.file(report)
    doLast {
        def f = jarFile.get().asFile
        def zip = new java.util.zip.ZipFile(f)
        def names = zip.entries().collect { it.name }
        def problems = []
        names.findAll { it.endsWith('.class') }.each { n ->
            if (!n.startsWith('org/overengineer/bettacraft/')) problems << "foreign class ${n}"
            if (n.contains('/gametest/') || n.contains('/dev/') || n.contains('DevSmoke') || n.contains('DevClient')) problems << "dev class ${n}"
        }
        names.findAll { it.startsWith('assets/') || it.startsWith('data/') }.each { n ->
            def ns = n.split('/')
            if (ns.length > 2 && !(ns[1] in ['bettacraft', 'minecraft', 'c', 'fabric', 'neoforge'])
                    && !n.startsWith('data/') ) problems << "foreign asset ${n}"
        }
        ['fabric.mod.json', 'bettacraft.mixins.json', 'bettacraft.fabric.mixins.json', 'bettacraft.accesswidener',
         'data/bettacraft/modonomicon/books/handbook/book.json',
         'META-INF/services/org.overengineer.bettacraft.platform.Platform',
         'META-INF/services/org.overengineer.bettacraft.platform.client.ClientPlatform'].each { need ->
            if (!names.contains(need)) problems << "missing ${need}"
        }
        if (names.any { it.startsWith('assets/bettacraft/guides/') }) problems << 'GuideME pages in the Fabric jar'
        def modJson = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json')))
        if (modJson.version != version) problems << "fabric.mod.json version ${modJson.version}, expected ${version}"
        if (modJson.depends?.minecraft != mcDependency) problems << "fabric.mod.json minecraft ${modJson.depends?.minecraft}, expected ${mcDependency}"
        if (expected != null && modJson.version != expected) problems << "fabric.mod.json version ${modJson.version}, tag ${expected}"
        def recipe = names.find { it.startsWith('data/bettacraft/recipe/') && it.endsWith('.json') }
        names.findAll { it.startsWith('data/bettacraft/') && it.endsWith('.json') }.each { n ->
            def t = zip.getInputStream(zip.getEntry(n)).getText('UTF-8')
            if (t.contains('"neoforge:conditions"') || t.contains('"neoforge:components"')) problems << "unconverted NeoForge data ${n}"
        }
        zip.close()
        def classes = names.count { it.endsWith('.class') }
        def text = "Fabric jar ${f.name}: ${names.size()} files, ${classes} classes, version ${modJson.version}\n" +
                (problems ? problems.collect { "PROBLEM: ${it}" }.join('\n') : 'OK') + '\n'
        report.get().asFile.text = text
        logger.lifecycle(text.trim())
        if (problems) throw new GradleException("verifyFabricJar: ${problems.size()} problem(s), see ${report.get().asFile}")
    }
}
tasks.named('check').configure { dependsOn 'verifyFabricJar' }

// Loom's default client / server runs would answer the root's runClient / runServer (meant for NeoForge) as well: off; the
// Fabric runs are runFabricClient / runFabricServer / runFabricGameTest
['runClient', 'runServer'].each { n -> tasks.matching { it.name == n }.configureEach { enabled = false } }

// ---- M52: production runs (like a player's Fabric profile; M52c: 26.1 has no intermediary any more): the released jar,
// the dev smoke jar and the official jars of the other mods; gradlew prodFabricServer -Psmoketest / prodFabricClient
// -Psmoketestfabric (background window), run dirs <fabricRunRoot>/prod-server and <fabricRunRoot>/prod-client.
// M52c: -PprodMinecraft=<version> runs them on another Minecraft of the declared range (26.1, 26.1.1)
def prodMinecraft = project.findProperty('prodMinecraft') ?: project.minecraft_version
configurations {
    prodMods { transitive = false }
}
dependencies {
    prodMods "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    prodMods "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"
    prodMods "maven.modrinth:modonomicon:${modonomicon_fabric_version}"
    prodMods "maven.modrinth:jade:${jade_fabric_version}"
    prodMods "com.terraformersmc:modmenu:${modmenu_version}"
}
def remapDevJar = tasks.register('devJar', Jar) {
    from sourceSets.dev.output
    archiveClassifier = 'devsmoke'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}
def prodProps = { boolean client ->
    def l = []
    if (project.hasProperty('smoketest')) l << '-Dbettacraft.smoketest=true'
    if (client) {
        l << '-Dbettacraft.background=true'
        if (project.hasProperty('smoketestfabric')) l += ['-Dbettacraft.smoketest.fabric=true', '-Dbettacraft.smoketest.world=true']
        if (project.hasProperty('smoketestbook')) l << '-Dbettacraft.smoketest.book=true'
    }
    l
}
tasks.register('prodFabricServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    group = 'bettacraft'
    mods.from(tasks.named('jar'))
    mods.from(remapDevJar)
    mods.from(configurations.prodMods)
    installerVersion = '1.0.1'
    loaderVersion = project.fabric_loader_version
    minecraftVersion = prodMinecraft
    runDir = rootProject.layout.projectDirectory.dir("${fabricRunRoot}/prod-server")
    jvmArgs.addAll(prodProps(false))
    programArgs.add('--nogui')
    doFirst {
        def d = rootProject.file("${fabricRunRoot}/prod-server"); d.mkdirs(); new File(d, 'eula.txt').text = 'eula=true\n'
    }
}
tasks.register('prodFabricClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    group = 'bettacraft'
    mods.from(tasks.named('jar'))
    mods.from(remapDevJar)
    mods.from(configurations.prodMods)
    minecraftVersion = prodMinecraft
    runDir = rootProject.layout.projectDirectory.dir("${fabricRunRoot}/prod-client")
    jvmArgs.addAll(prodProps(true))
    programArgs.addAll(['--width', '1280', '--height', '760'])
}

// every Fabric GameTest run starts with a fresh world (like the NeoForge runs)
tasks.matching { it.name == 'runFabricGameTest' }.configureEach {
    doFirst { rootProject.file("${fabricRunRoot}/gametest/world").deleteDir() }
}

// -Pquests: the FTB Quests chapter of modpack/ into the Fabric runs (replaced every run, removed without the flag)
tasks.matching { it.name in ['runFabricClient', 'runFabricServer', 'runFabricGameTest'] }.configureEach { t ->
    def base = t.name == 'runFabricGameTest' ? "${fabricRunRoot}/gametest" : t.name == 'runFabricServer' ? "${fabricRunRoot}/server" : fabricRunRoot
    // M52c: the chapter and (FTB Quests 26.1) its texts in the lang folder
    def files = ['chapters/bettacraft.json5', 'lang/en_us/chapters/bettacraft.json5'].collect { rel ->
        [src: rootProject.file('modpack/config/ftbquests/quests/' + rel), dst: rootProject.file(base + '/config/ftbquests/quests/' + rel)]
    }
    def on = project.hasProperty('quests')
    t.doFirst {
        files.each { f ->
            if (on) {
                f.dst.parentFile.mkdirs()
                java.nio.file.Files.copy(f.src.toPath(), f.dst.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } else if (f.dst.exists()) f.dst.delete()
        }
    }
}

// gradlew fabricMultiplayerTest : the Fabric multiplayer test. A dedicated Fabric server (<fabricRunRoot>/mp-server, port 25595,
// offline mode, the stage of FabricMpSmoke) and, once it is up, two background clients Dev1 and Dev2 (<fabricRunRoot>/mp-client1|2,
// FabricMpClient) that join, check what they got synced and report in the chat. The game processes are started from the java
// command lines of runFabricServer / runFabricClient. Logs: build/mptest-fabric/*.log. Fails without "MP PASSED".
tasks.register('fabricMultiplayerTest') {
    group = 'verification'
    notCompatibleWithConfigurationCache('starts the game processes of the run tasks')
    dependsOn 'classes', 'devClasses', 'processDevResources'
    doLast {
        def srv = tasks.named('runFabricServer').get()
        def cli = tasks.named('runFabricClient').get()
        def java = srv.javaLauncher.get().executablePath.asFile.absolutePath
        def logs = rootProject.file('build/mptest-fabric')
        logs.deleteDir(); logs.mkdirs()
        def cmd = { t, List extraJvm, List extraArgs ->
            [java] + t.allJvmArgs.findAll { !it.startsWith('-Dbettacraft.') } + extraJvm + ['-cp', t.classpath.asPath, t.mainClass.get()] + t.args + extraArgs
        }
        def sdir = rootProject.file("${fabricRunRoot}/mp-server")
        new File(sdir, 'world').deleteDir()
        sdir.mkdirs()
        new File(sdir, 'eula.txt').text = 'eula=true\n'
        new File(sdir, 'server.properties').text = 'server-port=25595\nonline-mode=false\nspawn-protection=0\nlevel-type=minecraft\\:flat\ngamemode=creative\nenforce-secure-profile=false\n'
        def server = new ProcessBuilder(cmd(srv, ['-Dbettacraft.smoketest.mp=true'], [])).directory(sdir)
                .redirectErrorStream(true).redirectOutput(new File(logs, 'server.log')).start()
        def clients = []
        try {
            def up = false
            for (int i = 0; i < 600 && !up; i++) {
                Thread.sleep(1000)
                up = new File(logs, 'server.log').text.contains('Done (')
                if (!server.alive) throw new GradleException('the Fabric MP server stopped, see build/mptest-fabric/server.log')
            }
            if (!up) throw new GradleException('the Fabric MP server did not come up')
            ['Dev1', 'Dev2'].eachWithIndex { name, i ->
                def dir = rootProject.file("${fabricRunRoot}/mp-client${i + 1}")
                dir.mkdirs()
                new File(dir, 'options.txt').text = 'onboardAccessibility:false\npauseOnLostFocus:false\nsoundCategory_master:0.0\nmaxFps:30\n'
                clients << new ProcessBuilder(cmd(cli, ['-Dbettacraft.smoketest.mpclient=true', '-Dbettacraft.background=true'], ['--username', name]))
                        .directory(dir).redirectErrorStream(true).redirectOutput(new File(logs, "client${i + 1}.log")).start()
            }
            server.waitFor(15, java.util.concurrent.TimeUnit.MINUTES)
            clients.each { it.waitFor(2, java.util.concurrent.TimeUnit.MINUTES) }
        } finally {
            ([server] + clients).each { if (it.alive) it.destroyForcibly() }
        }
        def log = new File(logs, 'server.log').text
        if (!log.contains('MP PASSED')) throw new GradleException('Fabric multiplayer test FAILED, see build/mptest-fabric/server.log')
        logger.lifecycle('fabricMultiplayerTest PASSED (logs in build/mptest-fabric)')
    }
}

// gradlew fabricSaveLoadTest : the Fabric save/load test. A dedicated Fabric server builds the showcase world (every kind of
// tank with animals, plants and equipment, plus the rows of the upgrade reference) in <fabricRunRoot>/saveload and writes its
// manifest; then the world is loaded again twice (DevSmokeUpgrade stages 1 and 2: the manifest, then save and reload):
// nothing may be lost. Logs: build/saveload-fabric/*.log.
tasks.register('fabricSaveLoadTest') {
    group = 'verification'
    notCompatibleWithConfigurationCache('starts the game processes of the run task')
    dependsOn 'classes', 'devClasses', 'processDevResources'
    doLast {
        def srv = tasks.named('runFabricServer').get()
        def java = srv.javaLauncher.get().executablePath.asFile.absolutePath
        def logs = rootProject.file('build/saveload-fabric')
        logs.deleteDir(); logs.mkdirs()
        def dir = rootProject.file("${fabricRunRoot}/saveload")
        dir.deleteDir(); dir.mkdirs()
        new File(dir, 'eula.txt').text = 'eula=true\n'
        new File(dir, 'server.properties').text = ['online-mode=false', 'level-type=minecraft:flat', 'gamemode=creative', 'difficulty=peaceful',
                'spawn-monsters=false', 'spawn-animals=true', 'generate-structures=false', 'server-port=25596', 'spawn-protection=0',
                'level-seed=21', 'allow-flight=true', 'max-tick-time=-1'].join(System.lineSeparator()) + System.lineSeparator()
        def run = { String name, List props, String expect ->
            def cmd = [java] + srv.allJvmArgs.findAll { !it.startsWith('-Dbettacraft.') } + props + ['-cp', srv.classpath.asPath, srv.mainClass.get()] + srv.args
            def log = new File(logs, name + '.log')
            def p = new ProcessBuilder(cmd).directory(dir).redirectErrorStream(true).redirectOutput(log).start()
            if (!p.waitFor(20, java.util.concurrent.TimeUnit.MINUTES)) { p.destroyForcibly(); throw new GradleException("${name}: timeout") }
            def text = log.text
            text.readLines().findAll { it.contains('[showcase] built') || it.contains('UPGRADE STAGE') || it.contains('[smoketest] upgrade') }.each { logger.lifecycle("  ${it}") }
            if (!text.contains(expect)) throw new GradleException("fabricSaveLoadTest: ${name} failed, see ${log}")
        }
        run('build', ['-Dbettacraft.showcase=true'], '[showcase] built')
        if (!new File(dir, 'world/bettacraft_reference.json').exists()) throw new GradleException('fabricSaveLoadTest: no manifest written')
        run('stage1', ['-Dbettacraft.smoketest.upgrade=1'], 'UPGRADE STAGE 1 PASSED')
        run('stage2', ['-Dbettacraft.smoketest.upgrade=2'], 'UPGRADE STAGE 2 PASSED')
        logger.lifecycle('fabricSaveLoadTest PASSED')
    }
}
