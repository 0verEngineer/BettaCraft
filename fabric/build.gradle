        sp.write((lines.findAll { !it.startsWith('server-port=') } + ["server-port=${fabricDevPort}".toString()]).join('\n') + '\n', 'UTF-8')
        logger.lifecycle("server files: ${sp} (port ${fabricDevPort})")
    }
}
